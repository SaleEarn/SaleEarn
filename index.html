<script data-saleearn-purchase-identity="v1">
(function(){
  'use strict';
  function exactProductId(a,b){return String(a||'')===String(b||'')}
  function orderBelongsToViewer(o){
    if(!o)return false;
    if(typeof isAdmin==='function'&&isAdmin())return true;
    const u=S.currentUser;
    if(u)return (!o.customerId||String(o.customerId)===String(u.id)||String(o.customerEmail||'').toLowerCase()===String(u.email||'').toLowerCase());
    return String(window.lastPurchasedOrderId||'')===String(o.id||'');
  }
  function exactOrderForProduct(id){
    const u=S.currentUser,uid=String(u?.id||''),email=String(u?.email||'').toLowerCase();
    return (S.orders||[]).find(o=>o.status==='SUCCESS'&&exactProductId(o.productId,id)&&((u&&(String(o.customerId||'')===uid||String(o.customerEmail||'').toLowerCase()===email))||(!u&&String(window.lastPurchasedOrderId||'')===String(o.id||''))));
  }
  function savedDelivery(o){
    const links=Array.isArray(o?.deliveryLinks)&&o.deliveryLinks.length?o.deliveryLinks.filter(Boolean):(o?.deliveryUrl?[o.deliveryUrl]:[]);
    const titles=Array.isArray(o?.deliveryTitles)?o.deliveryTitles:[];
    return links.map((url,i)=>({url,title:titles[i]||`File ${i+1}`}));
  }
  function purchaseSuccessPage(id){
    const o=(S.orders||[]).find(x=>String(x.id)===String(id));
    if(!o||o.status!=='SUCCESS'||!orderBelongsToViewer(o))return notFound();
    window.lastPurchasedOrderId=o.id;
    const p=product(o.productId),title=o.productTitle||p?.title||'Purchased product',image=o.productImage||p?.image||'';
    const links=savedDelivery(o);
    return `${header()}<main class="page"><div class="container"><div class="success-card"><div class="success-icon">✓</div><h1>Payment Successful</h1><p class="muted">Your verified delivery for this exact product is ready.</p><div class="dash-card" style="text-align:left;margin:18px 0"><div style="display:flex;gap:12px;align-items:center">${image?`<img src="${esc(image)}" alt="${esc(title)}" style="width:78px;height:62px;object-fit:cover;border-radius:10px">`:''}<div><b>${esc(title)}</b><div class="small muted">Product ID: ${esc(o.productId||'-')} · Order ID: ${esc(o.id||'-')}</div></div></div></div><div class="delivery-links">${links.map(x=>`<div class="link-box delivery-link-item"><div><b>${esc(x.title)}</b><small>${esc((()=>{try{return new URL(x.url).hostname}catch{return 'Secure delivery link'}})())}</small></div><button class="btn primary" onclick="window.open('${esc(x.url)}','_blank','noopener')">Open Secret Link</button></div>`).join('')||'<div class="link-box">No saved delivery link is available for this order. Contact seller support instead of opening another product link.</div>'}</div><p class="small muted">Only the delivery snapshot saved with this order is used.</p><div class="hero-actions" style="justify-content:center"><button class="btn" onclick="go('account/orders')">View My Order</button><button class="btn" onclick="go('market')">Continue Shopping</button></div></div></div></main>${footer()}`;
  }

  window.hasPurchased=function(pid){
    if(typeof isAdmin==='function'&&isAdmin())return true;
    return !!exactOrderForProduct(pid);
  };
  window.openPurchasedByProduct=function(id){
    const o=exactOrderForProduct(id);
    if(!o)return toast('Purchase not found for this exact product');
    window.lastPurchasedOrderId=o.id;
    openPurchasedAsset(o.id);
  };
  window.openPurchasedAsset=function(orderId){
    const o=(S.orders||[]).find(x=>String(x.id)===String(orderId));
    if(!o||o.status!=='SUCCESS'||!orderBelongsToViewer(o)){toast('Secure file access unavailable');return}
    window.lastPurchasedOrderId=o.id;
    go('success/'+encodeURIComponent(String(o.id)));
  };
  success=purchaseSuccessPage;
})();
</script>

<script data-saleearn-referral-online-activation="v1">
(function(){
  'use strict';
  window.applyReferralUpgradePayment=function(x,source){
    if(!x||x.paymentVerified!==true)return false;
    const s=currentSeller(),sid=String(s?.id||'');
    if(!s||!sid)return false;
    const target=Number(x.rate),amount=Number(x.price||0),current=referralRate(s),gatewayId=String(x.gatewayPaymentId||'');
    if(!Number.isFinite(target)||target<6||target>20||!Number.isFinite(amount)||amount<=0){toast('Referral payment details are invalid');return false}
    S.referralUpgrades=Array.isArray(S.referralUpgrades)?S.referralUpgrades:[];
    const existing=gatewayId&&S.referralUpgrades.find(r=>String(r.gatewayPaymentId||'')===gatewayId&&String(r.sellerId||'')===sid&&r.paymentStatus==='SUCCESS');
    if(existing){
      if(referralRate(s)<Number(existing.toRate))s.referralPercent=Number(existing.toRate);
      save();clearInterval(window.paymentTimer);showReferralUpgradeSuccess(Number(existing.toRate),Number(existing.amount||amount),existing.paymentSource||source,Number(existing.fromRate||target-1));return true;
    }
    if(target<=current){if(target===current){toast('Referral rate is already active');return true}toast('Referral level changed. Payment was not applied.');return false}
    if(target!==current+1){toast('Only the next referral level can be activated');return false}
    const fromRate=current,refId=String(x.id||uid('ru'));
    S.referralUpgrades.unshift({id:refId,sellerId:sid,fromRate,toRate:target,amount,paymentSource:source||'RAZORPAY_TEST',paymentStatus:'SUCCESS',paymentVerified:true,gatewayPaymentId:x.gatewayPaymentId||null,razorpayOrderId:x.razorpayOrderId||null,date:nowISO(),levels:[target]});
    s.referralPercent=target;save();clearInterval(window.paymentTimer);showReferralUpgradeSuccess(target,amount,source||'RAZORPAY_TEST',fromRate);return true;
  };
})();
</script>

<script data-saleearn-paid-features-supabase="v1">
(function(){
  'use strict';
  function badgeLedger(){
    const sid=currentSeller()?.id||S.currentUser?.sellerId||'guest';
    S.badgeLedgers=S.badgeLedgers&&typeof S.badgeLedgers==='object'?S.badgeLedgers:{};
    return S.badgeLedgers[sid]||(S.badgeLedgers[sid]={freeLimit:3,price:3,credits:0,placedProductIds:[],purchases:[]});
  }
  function addBadgeCredits(quantity,amount,source,response,referenceId){
    const st=badgeLedger(),gatewayId=response?.razorpay_payment_id||response?.gatewayPaymentId||null;
    st.purchases=Array.isArray(st.purchases)?st.purchases:[];
    if(gatewayId&&st.purchases.some(x=>String(x.gatewayPaymentId||'')===String(gatewayId)&&x.paymentVerified!==false))return false;
    st.credits=Math.min(100,Number(st.credits||0)+Number(quantity||0));
    st.purchases.unshift({id:referenceId||uid('badgepay'),sellerId:currentSeller()?.id,quantity:Number(quantity),amount:Number(amount),source:source||'RAZORPAY_TEST',paymentStatus:'SUCCESS',paymentVerified:true,gatewayPaymentId:gatewayId,razorpayOrderId:response?.razorpay_order_id||response?.razorpayOrderId||null,date:nowISO()});
    save();
    return true;
  }
  window.openBadgeCredits=function(){
    const st=badgeLedger(),max=Math.max(0,100-Number(st.credits||0));
    if(!max)return toast('Badge credit limit reached');
    document.getElementById('modalRoot').innerHTML=`<div class="modal-bg"><div class="modal"><button class="btn iconbtn close" onclick="closeModal()">×</button><h2>Buy Badge Credits</h2><p class="muted">₹3 per placement · Credits sync to Supabase after verified payment.</p><div class="field"><label>Quantity</label><input id="badgeQty" type="number" min="1" max="${max}" value="10" oninput="document.getElementById('badgeTotal').textContent=money(Math.max(1,Math.min(${max},Number(this.value)||1))*3)"></div><div class="dash-card"><b>Total: <span id="badgeTotal">${money(30)}</span></b><div class="small muted">Current credits: ${st.credits} · Maximum: 100</div></div><div class="modal-footer"><button class="btn" onclick="buyBadgeCredits('BALANCE')">Pay from Balance</button><button class="btn primary" onclick="buyBadgeCredits('RAZORPAY_TEST')">Pay Online with Razorpay</button></div></div></div>`;
  };
  window.buyBadgeCredits=async function(source){
    const st=badgeLedger(),sid=currentSeller()?.id;if(!sid)return;

<script data-saleearn-marketplace-boost-duplicate-guard="v1">
(function(){
  'use strict';
  function marketplacePackage(){
    const c=ensurePlatformConfig();
    c.ads=c.ads||{};c.ads.packages=Array.isArray(c.ads.packages)?c.ads.packages:[];
    let p=c.ads.packages.find(x=>String(x.id)==='marketplace');
    if(!p){
      p={id:'marketplace',name:'Marketplace Boost',price:12,days:1,impressionLimit:0,clickLimit:0,placement:'Marketplace',approval:false,active:true};
      c.ads.packages.push(p);
    }else{p.name='Marketplace Boost';p.price=12;p.days=1;p.placement='Marketplace';p.active=p.active!==false;}
    return p;
  }
  function adConflict(productId,placement){
    const now=Date.now();
    return (S.ads||[]).find(a=>String(a.productId)===String(productId)&&String(a.sellerId)===String(currentSeller()?.id||'')&&String(a.placement||a.type||'')===String(placement||'')&&a.status!=='CANCELLED'&&(!a.endDate||new Date(a.endDate).getTime()>now));
  }
  const oldOpenAd=window.openAdCampaign;
  window.openAdCampaign=function(){
    marketplacePackage();
    const result=oldOpenAd?.apply(this,arguments);
    const el=document.getElementById('adType');
    if(el&&!el.querySelector('option[value="marketplace"]')){
      el.insertAdjacentHTML('beforeend','<option value="marketplace" data-price="12">Marketplace Boost · ₹12/day</option>');
    }
    if(el&&!el.dataset.marketplaceBoostBound){
      el.dataset.marketplaceBoostBound='1';
      el.addEventListener('change',function(){
        if(this.value==='marketplace'){
          const days=document.getElementById('adDays');
          if(days)days.value='1';
          const total=document.getElementById('adTotal');
          if(total)total.textContent=money(12);
        }
      });
    }
    return result;
  };
  const oldCreateAd=window.createAd;
  window.createAd=function(){
    const productId=document.getElementById('adProduct')?.value||'';
    const packageId=document.getElementById('adType')?.value||'';
    const p=marketplacePackage()&&ensurePlatformConfig().ads.packages.find(x=>String(x.id)===String(packageId));
    const placement=p?.placement||p?.name||packageId;
    const conflict=productId&&adConflict(productId,placement);
    if(conflict){
      toast('This product is already boosted in '+placement+'. Choose another placement or wait until it ends.');
      return;
    }
    return oldCreateAd?.apply(this,arguments);
  };
})();
</script>

  const planConfig=()=>{try{return ensurePlatformConfig()}catch{return S.platformConfig||{plans:[]}}};
  const planById=id=>{const key=upper(id||'FREE');return (planConfig().plans||[]).find(x=>upper(x.id)===key)||{id:'FREE',name:'FREE',uploadLimit:10,ads:false,analytics:false,referrals:true,advanced:false,prioritySupport:false,verified:false,commissionPct:20}};
  const validDate=v=>{const t=new Date(v||0).getTime();return Number.isFinite(t)?t:NaN};
  const subscriptionEnd=x=>{const st=validDate(x?.startDate||x?.date),end=validDate(x?.endDate);return Number.isFinite(end)?end:(Number.isFinite(st)?st+SUBSCRIPTION_DURATION_MS:NaN)};
  const subscriptionActive=(x,t)=>{
    if(!x||cancelledStates.has(upper(x.status)))return false;
    if(upper(x.paymentStatus||'SUCCESS')!=='SUCCESS'||x.paymentVerified===false)return false;
    const started=validDate(x.startDate||x.date),ends=subscriptionEnd(x),cancelledAt=validDate(x.cancelledAt);
    return Number.isFinite(started)&&started<=t&&Number.isFinite(ends)&&t<ends&&(!Number.isFinite(cancelledAt)||cancelledAt>t);
  };
  window.activeSubscriptionAt=function(sid,when){
    const t=validDate(when)||Date.now();
    return (S.subscriptions||[]).filter(x=>x.sellerId===sid&&subscriptionActive(x,t)).sort((a,b)=>validDate(b.startDate||b.date)-validDate(a.startDate||a.date))[0]||null;
  };
  window.sellerPlanNow=function(sid,when){
    const sub=window.activeSubscriptionAt(sid,when||Date.now()),s=S.sellers?.[sid];
    return upper(sub?.plan||s?.plan||'FREE')||'FREE';
  };
  window.sellerPlanConfig=function(sid,when){return planById(window.sellerPlanNow(sid,when))};
  window.sellerPlanFeatureActive=function(sid,feature,when){
    const p=window.sellerPlanConfig(sid,when);
    return p[feature]!==false;
  };
  window.sellerProductLimit=function(sid,when){
    const p=window.sellerPlanConfig(sid,when),global=Number(planConfig().rules?.productUploadLimit||1e9),limit=Number(p.uploadLimit);
    return Math.max(0,Math.min(Number.isFinite(global)?global:1e9,Number.isFinite(limit)?limit:10));
  };
  window.subscriptionCancellationState=function(sid){
    const s=S.sellers?.[sid];
    return !!(s?.subscriptionStatus==='CANCELLED'||s?.subscriptionCancelledAt);
  };

  // Keep the seller's stored product list untouched when a plan is cancelled.
  // Only future publishing/restoring is blocked by the current plan limit.
  const priorPublish=window.publishProduct;
  if(priorPublish)window.publishProduct=function(editId){
    const seller=typeof currentSeller==='function'?currentSeller():null;
    if(seller&&!editId){
      const listed=(S.products||[]).filter(x=>x.sellerId===seller.id).length;
      const limit=window.sellerProductLimit(seller.id);
      if(listed>=limit){toast('Product limit reached ('+limit+'). Existing products were kept. Buy a plan to add more.');return}
    }
    return priorPublish.apply(this,arguments);
  };
  const priorDraftLimit=window.draftLimitForSeller;
  window.draftLimitForSeller=function(s){return s?.id?window.sellerProductLimit(s.id):(priorDraftLimit?priorDraftLimit(s):10)};
  const priorRestore=window.restoreRecycled;
  if(priorRestore)window.restoreRecycled=function(id){
    const x=(S.deletedProducts||[]).find(p=>p.id===id),seller=typeof currentSeller==='function'?currentSeller():null;
    if(x&&x.recycledFrom!=='drafts'&&seller){
      const listed=(S.products||[]).filter(p=>p.sellerId===seller.id).length;
      const limit=window.sellerProductLimit(seller.id);
      if(listed>=limit){toast('Product limit reached ('+limit+'). Buy a plan to restore/add this product.');return}
    }
    return priorRestore.apply(this,arguments);
  };

  // Only the admin can cancel. Cancellation is immediate and does not rewrite
  // any historical order fee/earnings snapshot.
  const priorCancel=window.adminCancelService;
  window.adminCancelService=function(type,id){
    if(typeof adminOnly==='function'&&!adminOnly())return;
    if(type!=='subscription')return priorCancel?priorCancel.apply(this,arguments):undefined;
    const sub=(S.subscriptions||[]).find(x=>x.id===id);
    if(!sub||cancelledStates.has(upper(sub.status)))return;
    const seller=S.sellers?.[sub.sellerId];
    const refund=Math.round((typeof prorata==='function'?prorata(sub):0)*100)/100;
    sub.status='CANCELLED';sub.cancelledAt=nowISO();sub.cancelledBy=S.currentUser?.id||'ADMIN';sub.cancellationReason='Cancelled by Admin';sub.endDate=sub.cancelledAt;sub.featuresDeactivatedAt=sub.cancelledAt;
    if(seller){
      seller.plan='FREE';
      seller.subscriptionStatus='CANCELLED';
      seller.subscriptionCancelledAt=sub.cancelledAt;
      seller.activeSubscriptionId=null;
      seller.planFeaturesDeactivatedAt=sub.cancelledAt;
    }
    S.balancePayments=S.balancePayments||[];S.serviceRefunds=S.serviceRefunds||[];
    if(refund>0)S.balancePayments.unshift({id:uid('refund'),sellerId:sub.sellerId,amount:-refund,kind:'subscriptionRefund',source:'BALANCE',status:'SUCCESS',paymentVerified:true,date:nowISO(),subscriptionId:id});
    S.serviceRefunds.unshift({id:uid('sr'),sellerId:sub.sellerId,type:'subscription',refId:id,amount:refund,reason:'ADMIN_CANCELLED',date:nowISO()});
    try{adminAudit('Cancelled subscription immediately',id,{sellerId:sub.sellerId,plan:sub.plan,refund,featuresDeactivated:true,existingProductsKept:true})}catch{}
    if(typeof syncSubscriptionPlans==='function')syncSubscriptionPlans();
    save();toast('Subscription cancelled. Plan features are now inactive; existing products were kept.');render();
  };

  // Subscription-controlled entry points are blocked immediately after cancel.
  const guardPlanFeature=(feature,message)=>{
    const sid=typeof currentSeller==='function'?currentSeller()?.id:null;
    if(!sid||window.sellerPlanFeatureActive(sid,feature))return true;
    toast(message||('This '+feature+' feature requires an active plan.'));return false;
  };
  const priorOpenAd=window.openAdCampaign;
  if(priorOpenAd)window.openAdCampaign=function(){if(!guardPlanFeature('ads','Ads are inactive on the FREE plan. Buy a plan to use Ads.'))return;return priorOpenAd.apply(this,arguments)};
  const priorCreateAd=window.createAd;
  if(priorCreateAd)window.createAd=function(){if(!guardPlanFeature('ads','Ads are inactive on the FREE plan. Buy a plan to use Ads.'))return;return priorCreateAd.apply(this,arguments)};
  const priorDashAds=window.dashAds;
  if(priorDashAds)window.dashAds=function(){
    const sid=typeof currentSeller==='function'?currentSeller()?.id:null;
    if(sid&&!window.sellerPlanFeatureActive(sid,'ads'))return dashShell('ads','<div class="dash-card"><h2>Ads inactive</h2><p class="muted">Your subscription was cancelled. Existing products and sales remain safe, but plan Ads features are inactive until you buy a plan again.</p><button class="btn primary" onclick="go(\'dashboard/subscription\')">View Plans</button></div>');
    return priorDashAds.apply(this,arguments);
  };

  // Sync once on every render so an expired/cancelled plan cannot keep premium state.
  const priorRender=window.render;
  if(priorRender)window.render=function(){
    try{if(typeof syncSubscriptionPlans==='function')syncSubscriptionPlans()}catch{}
    return priorRender.apply(this,arguments);
  };
  try{if(typeof syncSubscriptionPlans==='function')syncSubscriptionPlans()}catch{}
})();
</script>

<script id="saleearn-message-pack-sync-v1">
(function(){
  'use strict';
  // The shared app-state installer used to replace a freshly paid message pack
  // with an older remote snapshot. Merge keyed message data instead of losing it.
  const baseInstall=window.seInstall;
  const mergeRows=(localRows,remoteRows)=>{
    const map=new Map();
    [...(remoteRows||[]),...(localRows||[])].forEach(row=>{if(row?.id)map.set(String(row.id),row)});
    return [...map.values()].sort((a,b)=>new Date(b.date||b.createdAt||0)-new Date(a.date||a.createdAt||0));
  };
  if(baseInstall)window.seInstall=function(remote){
    const localPacks=structuredClone(S.messagePacks||[]),localMessages=structuredClone(S.messages||[]),localThreads=structuredClone(S.messageThreads||[]);
    const result=baseInstall.apply(this,arguments);
    S.messagePacks=mergeRows(localPacks,S.messagePacks);
    S.messages=mergeRows(localMessages,S.messages);
    S.messageThreads=mergeRows(localThreads,S.messageThreads);
    if(typeof v21Init==='function')v21Init();
    return result;
  };
  // Keep the paid pack visible immediately after saving, including when the
  // server response does not yet contain the newest message fields.
  const baseRecord=window.recordMessagePack;
  window.saleEarnMessagePackSyncReady=true;
})();
</script>

<!-- data-saleearn-all-payment-activation="v1" -->
<script id="saleearn-all-payment-activation-v1">
(function(){
  'use strict';
  const paidSources=new Set(['BALANCE','ONLINE_TEST','RAZORPAY_TEST']);
  const text=v=>String(v??'');
  const same=(a,b)=>text(a)===text(b);
  const sidOf=x=>text(x?.sellerId||currentSeller?.()?.id||'');
  const gatewayOf=x=>text(x?.gatewayPaymentId||'');
  const list=(key)=>Array.isArray(S[key])?S[key]:(S[key]=[]);
  const saveOnce=()=>{try{save()}catch(e){console.warn('Payment activation save failed',e)}};

  // Reconcile a verified service payment idempotently. This is a safety net for
  // callbacks that charged successfully but returned before the activation row
  // was written, and for old records with slightly different field names.
  const nativeApply=window.applyServicePayment;
  window.applyServicePayment=function(x,source){
    if(!x||x.paymentVerified!==true||!paidSources.has(text(source).toUpperCase()))return false;
    const src=text(source).toUpperCase(),sid=sidOf(x),kind=text(x.kind).toLowerCase(),meta=x.meta||{},gateway=gatewayOf(x),seller=S.sellers?.[sid];
    if(!sid||!seller)return false;
    let nativeResult=false;
    try{nativeResult=typeof nativeApply==='function'?!!nativeApply.call(this,x,source):false}catch(e){console.warn('Native payment activation failed; recovery will continue',e)}

    if(src==='BALANCE'){
      const bp=list('balancePayments');
      if(!bp.some(b=>gateway&&same(b.gatewayPaymentId,gateway)&&b.status==='SUCCESS')){
        bp.unshift({id:uid('bal'),sellerId:sid,amount:Number(x.amount||0),kind:x.kind,source:'BALANCE',status:'SUCCESS',paymentVerified:true,gatewayPaymentId:gateway||null,date:nowISO(),meta});
      }
    }

    if(kind==='subscription'){
      const subs=list('subscriptions');
      let sub=subs.find(z=>gateway&&same(z.gatewayPaymentId,gateway));
      if(!sub){
        const now=nowISO(),end=new Date(Date.now()+Number(SUBSCRIPTION_DURATION_MS||30*86400000)).toISOString();
        sub={id:uid('sub'),sellerId:sid,plan:text(meta.plan||x.plan||seller.plan||'FREE').toUpperCase(),amount:Number(x.amount||0),discount:Number(meta.discount||x.discount||0),paymentSource:src,paymentStatus:'SUCCESS',paymentVerified:true,gatewayPaymentId:gateway||null,date:now,startDate:now,endDate:end};
        subs.unshift(sub);
      }
      const plan=text(sub.plan||meta.plan||x.plan||'FREE').toUpperCase();
      sub.sellerId=sid;sub.plan=plan;sub.paymentSource=sub.paymentSource||src;sub.paymentStatus='SUCCESS';sub.paymentVerified=true;
      seller.plan=plan;seller.subscriptionStatus='ACTIVE';seller.activeSubscriptionId=sub.id;seller.lastSubscription={plan,amount:Number(sub.amount||x.amount||0),date:sub.date||nowISO(),discount:Number(sub.discount||0)};
      if(typeof syncSubscriptionPlans==='function')try{syncSubscriptionPlans()}catch(e){console.warn('Subscription plan reconcile failed',e)}
    }else if(kind==='ad'){
      const ads=list('ads');
      let ad=ads.find(z=>gateway&&same(z.gatewayPaymentId,gateway));
      if(!ad){
        const start=new Date(),days=Math.max(1,Number(meta.days||x.days||1)),end=new Date(start.getTime()+days*86400000);
        ad={id:uid('ad'),sellerId:sid,productId:meta.productId||x.productId||'',type:meta.type||x.type||'Ad',placement:meta.placement||meta.type||x.placement||x.type||'Marketplace',cost:Number(x.amount||0),clicks:0,status:'ACTIVE',startDate:start.toISOString(),endDate:end.toISOString(),paymentSource:src,paymentStatus:'SUCCESS',paymentVerified:true,gatewayPaymentId:gateway||null};
        ads.unshift(ad);
      }
      ad.sellerId=sid;ad.status='ACTIVE';ad.paymentStatus='SUCCESS';ad.paymentVerified=true;ad.paymentSource=ad.paymentSource||src;
    }
    saveOnce();
    return nativeResult||kind==='subscription'||kind==='ad';
  };

  // Preserve all paid rows when an older cloud snapshot is installed. The
  // shared JSON state can otherwise briefly remove a just-activated service.
  const oldInstall=window.seInstall;
  const paidArrayKeys=['subscriptions','ads','balancePayments','referralUpgrades','gatewayPayments','serviceRefunds','messagePacks'];
  const mergeRows=(localRows,remoteRows)=>{
    const map=new Map();
    [...(remoteRows||[]),...(localRows||[])].forEach(row=>{if(row?.id)map.set(text(row.id),row)});
    return [...map.values()];
  };
  if(oldInstall)window.seInstall=function(remote){
    const local={};
    paidArrayKeys.forEach(k=>{local[k]=structuredClone(Array.isArray(S[k])?S[k]:[])});
    const localBadges=structuredClone(S.badgeLedgers||{});
    const result=oldInstall.apply(this,arguments);
    paidArrayKeys.forEach(k=>{S[k]=mergeRows(local[k],S[k])});
    S.badgeLedgers=S.badgeLedgers&&typeof S.badgeLedgers==='object'?S.badgeLedgers:{};
    Object.entries(localBadges).forEach(([sellerId,ledger])=>{
      const current=S.badgeLedgers[sellerId]||{};
      S.badgeLedgers[sellerId]={...current,...ledger,credits:Math.max(Number(current.credits||0),Number(ledger.credits||0)),purchases:mergeRows(ledger.purchases,current.purchases),placedProductIds:[...new Set([...(current.placedProductIds||[]),...(ledger.placedProductIds||[])])]};
    });
    return result;
  };
  window.saleEarnPaymentActivationReady=true;
})();
</script>

<!-- data-saleearn-money-ledger="v1" -->
<script id="saleearn-money-ledger-v1">
(function(){
  'use strict';
  const PAISA=100;
  const n=v=>Number.isFinite(Number(v))?Number(v):0;
  const paise=v=>Math.round(n(v)*PAISA);
  const rupees=p=>paise(p)/PAISA;
  const exact=v=>rupees(paise(v));
  const upper=v=>String(v||'').trim().toUpperCase();
  const arr=k=>Array.isArray(S[k])?S[k]:(S[k]=[]);
  const moneyKeys={orders:['amount','originalAmount','couponDiscount','platformFee','netSellerAmount'],payouts:['amount','receivedAmount','returnedAmount'],ads:['cost'],subscriptions:['amount','discount'],balancePayments:['amount'],referralUpgrades:['amount','price'],referrals:['commission','paidAmount'],serviceRefunds:['amount'],sellerFinanceLedger:['amount'],adminFinancialLedger:['amount'],adminCommissionAdjustments:['amount']};
  function normalizeMoneyState(){
    Object.entries(moneyKeys).forEach(([collection,keys])=>arr(collection).forEach(row=>keys.forEach(k=>{if(row[k]!==undefined&&row[k]!==null)row[k]=exact(row[k])})));
    arr('coupons').forEach(c=>{if(String(c.type||'').toLowerCase()==='fixed'&&c.value!=null)c.value=exact(c.value)});
    // Keep a deterministic, auditable ledger. It is derived from verified records
    // and never becomes an additional balance, so it cannot create money.
    const ledger=[];
    arr('orders').filter(x=>upper(x.status)==='SUCCESS').forEach(x=>{
      const gross=paise(x.amount),fee=paise(x.platformFee??(n(x.amount)*n(x.platformFeeRate??.20))),net=Math.max(0,gross-fee);
      ledger.push({id:'sale:'+x.id,refId:x.id,type:'PRODUCT_SALE',status:'POSTED',sellerId:x.sellerId,date:x.date||nowISO(),buyerDebit:rupees(gross),sellerCredit:rupees(net),platformCredit:rupees(Math.min(gross,fee))});
    });
    arr('balancePayments').filter(x=>upper(x.status)==='SUCCESS'&&x.paymentVerified!==false).forEach(x=>{
      const amount=paise(x.amount),sign=amount>=0?-1:1;
      ledger.push({id:'balance:'+x.id,refId:x.id,type:upper(x.kind||'BALANCE_PAYMENT'),status:'POSTED',sellerId:x.sellerId,date:x.date||nowISO(),sellerDebit:rupees(Math.max(0,sign*amount)),sellerCredit:rupees(Math.max(0,-sign*amount)),platformCredit:rupees(Math.max(0,amount))});
    });
    arr('subscriptions').filter(x=>(upper(x.paymentStatus)==='SUCCESS'||x.paymentVerified===true)&&x.paymentVerified!==false).forEach(x=>ledger.push({id:'subscription:'+x.id,refId:x.id,type:'SUBSCRIPTION',status:'POSTED',sellerId:x.sellerId,date:x.date||nowISO(),platformCredit:exact(x.amount)}));
    arr('ads').filter(x=>(upper(x.paymentStatus)==='SUCCESS'||x.paymentVerified===true)&&x.paymentVerified!==false).forEach(x=>ledger.push({id:'ad:'+x.id,refId:x.id,type:'AD_PAYMENT',status:'POSTED',sellerId:x.sellerId,date:x.startDate||x.date||nowISO(),platformCredit:exact(x.cost)}));
    arr('payouts').filter(x=>['PENDING','PROCESSING','UNDER REVIEW','ON HOLD','APPROVED','PAID','SUCCESS','RECEIVED'].includes(upper(x.status))).forEach(x=>ledger.push({id:'payout:'+x.id,refId:x.id,type:'SELLER_PAYOUT',status:'POSTED',sellerId:x.sellerId,date:x.date||nowISO(),sellerDebit:exact(x.amount)}));
    arr('referrals').filter(x=>['ACTIVE','PAID'].includes(upper(x.status))).forEach(x=>ledger.push({id:'referral:'+x.id,refId:x.id,type:'REFERRAL_COMMISSION',status:'POSTED',sellerId:x.sellerId,date:x.date||nowISO(),sellerCredit:exact(x.commission),platformDebit:exact(x.commission)}));
    S.moneyLedger=ledger;
  }
  const nativeMoney=window.money;
  window.money=function(value){
    const v=exact(value);
    return currencyCode()==='USD'?'$'+(v/usdInrRate()).toFixed(2):'₹'+v.toFixed(2);
  };
  const nativeCouponDiscount=window.couponDiscount;
  if(nativeCouponDiscount)window.couponDiscount=function(c,price){return exact(nativeCouponDiscount(c,exact(price)))};
  const nativeEarnings=window.sellerEarnings;
  if(nativeEarnings)window.sellerEarnings=function(sid){return exact(nativeEarnings(sid))};
  const nativeBalance=window.sellerAvailableBalance;
  if(nativeBalance)window.sellerAvailableBalance=function(sid){return Math.max(0,exact(nativeBalance(sid)))};
  const nativeCommission=window.webCommissionStats;
  if(nativeCommission)window.webCommissionStats=function(days){const x=nativeCommission(days)||{};return Object.fromEntries(Object.entries(x).map(([k,v])=>[k,exact(v)]))};
  const nativeServiceApply=window.applyServicePayment;
  if(nativeServiceApply)window.applyServicePayment=function(x,source){
    if(x&&x.amount!=null)x={...x,amount:exact(x.amount),meta:{...(x.meta||{}),basePrice:x.meta?.basePrice==null?x.meta?.basePrice:exact(x.meta.basePrice),baseAmount:x.meta?.baseAmount==null?x.meta?.baseAmount:exact(x.meta.baseAmount),discount:x.meta?.discount==null?x.meta?.discount:exact(x.meta.discount)}};
    const result=nativeServiceApply.call(this,x,source);normalizeMoneyState();return result;
  };
  const nativeSave=window.save;
  if(nativeSave)window.save=function(){normalizeMoneyState();return nativeSave.apply(this,arguments)};
  const nativeSnapshot=window.onlineSnapshot;
  if(nativeSnapshot)window.onlineSnapshot=function(){return {...nativeSnapshot(),moneyLedger:S.moneyLedger||[]}};
  const nativeInstall=window.seInstall;
  if(nativeInstall)window.seInstall=function(remote){const local=structuredClone(S.moneyLedger||[]),result=nativeInstall.apply(this,arguments);const remoteLedger=Array.isArray(S.moneyLedger)?S.moneyLedger:[];const map=new Map([...remoteLedger,...local].map(x=>[String(x.id),x]));S.moneyLedger=[...map.values()];return result};
  normalizeMoneyState();
  window.saleEarnMoney={paise,rupees,exact,normalize:normalizeMoneyState};
  window.saleEarnMoneyLedgerReady=true;
})();
</script>

<script id="saleearn-subscription-activation-reconcile-v1">
(function(){
  'use strict';
  const upper=v=>String(v||'').trim().toUpperCase();
  const cancelled=new Set(['CANCELLED','CANCELED','FAILED','VOID','REVOKED','REFUNDED']);
  const successStates=new Set(['SUCCESS','PAID','APPROVED','ACTIVE','VERIFIED']);
  const validPaid=x=>{
    if(!x||cancelled.has(upper(x.status))||x.paymentVerified===false)return false;
    const hasProof=x.paymentVerified===true||successStates.has(upper(x.paymentStatus))||successStates.has(upper(x.status));
    return hasProof;
  };
  const time=v=>{const t=new Date(v||0).getTime();return Number.isFinite(t)?t:NaN};
  const startOf=x=>time(x?.startDate||x?.date||x?.createdAt||x?.paidAt);
  const endOf=x=>{const explicit=time(x?.endDate||x?.expiresAt);if(Number.isFinite(explicit))return explicit;const start=startOf(x);return Number.isFinite(start)?start+Number(SUBSCRIPTION_DURATION_MS||30*86400000):NaN};
  const activeNow=(x,when=Date.now())=>{const st=startOf(x),en=endOf(x);return validPaid(x)&&Number.isFinite(st)&&st<=when&&Number.isFinite(en)&&when<en};
  window.activeSubscriptionAt=function(sid,when){
    const now=time(when)||Date.now(),key=String(sid);
    return (S.subscriptions||[]).filter(x=>String(x.sellerId)===key&&activeNow(x,now)).sort((a,b)=>startOf(b)-startOf(a))[0]||null;
  };
  window.sellerPlanNow=function(sid,when){
    const sub=window.activeSubscriptionAt(sid,when||Date.now()),ss=S.sellers?.[sid];
    return upper(sub?.plan||ss?.plan||'FREE')||'FREE';
  };
  window.sellerPlanConfig=function(sid,when){
    const id=window.sellerPlanNow(sid,when);
    return (ensurePlatformConfig().plans||[]).find(p=>upper(p.id)===id)||{id:'FREE',name:'FREE',ads:false,analytics:false,referrals:true,advanced:false,prioritySupport:false,verified:false,commissionPct:20,uploadLimit:10};
  };
  window.sellerPlanFeatureActive=function(sid,feature,when){return window.sellerPlanConfig(sid,when)[feature]!==false};
  function reconcile(){
    let changed=false,now=Date.now();
    S.subscriptions=Array.isArray(S.subscriptions)?S.subscriptions:[];
    Object.values(S.sellers||{}).forEach(ss=>{
      const sub=window.activeSubscriptionAt(ss.id,now),old=String(ss.plan||'FREE'),next=upper(sub?.plan||'FREE')||'FREE';
      if(sub){
        if(sub.status!=='ACTIVE'){sub.status='ACTIVE';changed=true}
        if(sub.paymentStatus!=='SUCCESS'){sub.paymentStatus='SUCCESS';changed=true}
        if(sub.paymentVerified!==true){sub.paymentVerified=true;changed=true}
        if(!sub.startDate&&sub.date){sub.startDate=sub.date;changed=true}
        if(!sub.endDate){sub.endDate=new Date(startOf(sub)+Number(SUBSCRIPTION_DURATION_MS||30*86400000)).toISOString();changed=true}
      }
      if(old!==next){ss.plan=next;changed=true}
      ss.subscriptionStatus=sub?'ACTIVE':(S.subscriptions.some(x=>String(x.sellerId)===String(ss.id)&&validPaid(x))?'EXPIRED':(ss.subscriptionStatus||'FREE'));
      ss.activeSubscriptionId=sub?.id||null;
    });
    if(changed){try{save()}catch(e){console.warn('Subscription reconciliation save failed',e)}}
    return changed;
  }
  window.syncSubscriptionPlans=reconcile;
  reconcile();
  window.saleEarnSubscriptionActivationReady=true;
})();
</script>
