 const plans=c.plans.slice(0,3).map(x=>{const ft=Array.isArray(x.featureText)?x.featureText:[];return `<div class="admin-card subscription-admin-plan"><div class="section-head"><div><h3 style="margin:0">${escv(x.name)} <span class="admin-pill ${x.active?'success':'danger'}">${x.active?'ACTIVE':'OFF'}</span></h3><div class="small muted">ID: ${escv(x.id)} · Fixed plan slot</div></div></div><div class="form-grid">${input('Plan Name','pl_'+x.id+'_name',x.name)}${input('Monthly Price','pl_'+x.id+'_monthly',x.monthly,'number')} ${input('Yearly Price','pl_'+x.id+'_yearly',x.yearly,'number')} ${input('Lifetime Price','pl_'+x.id+'_lifetime',x.lifetime,'number')} ${input('Trial Days','pl_'+x.id+'_trial',x.trial,'number')} ${input('Discount %','pl_'+x.id+'_discount',x.discount,'number')} ${input('Upload Limit','pl_'+x.id+'_upload',x.uploadLimit,'number')} ${input('Storage MB','pl_'+x.id+'_storage',x.storageLimit,'number')} ${input('Commission %','pl_'+x.id+'_commission',x.commissionPct,'number')}</div><div class="subscription-feature-editor"><b>Plan feature text</b><div class="small muted">Admin can change what users see on this plan.</div>${Array.from({length:8},(_,i)=>input('Feature '+(i+1),'pl_'+x.id+'_feature'+(i+1),ft[i]||'')) .join('')}</div><div class="ac-checks">${check('Ads','pl_'+x.id+'_ads',x.ads)}${check('Analytics','pl_'+x.id+'_analytics',x.analytics)}${check('Referrals','pl_'+x.id+'_referrals',x.referrals)}${check('Advanced Features','pl_'+x.id+'_advanced',x.advanced)}${check('Priority Support','pl_'+x.id+'_priority',x.prioritySupport)}${check('Verified Badge','pl_'+x.id+'_verified',x.verified)}${check('Active','pl_'+x.id+'_active',x.active)}</div><button class="btn primary" onclick="adminPlanSave('${escv(x.id)}')">Save Plan</button></div>`;}).join('');
 const ads=c.ads.packages.map(x=>`<div class="admin-card"><div class="section-head"><h3 style="margin:0">${escv(x.name)}</h3><span class="admin-pill ${x.active?'success':'danger'}">${x.active?'ACTIVE':'OFF'}</span></div><div class="form-grid">${input('Name','ad_'+x.id+'_name',x.name)}${input('Price','ad_'+x.id+'_price',x.price,'number')}${input('Days','ad_'+x.id+'_days',x.days,'number')}${input('Impression Limit','ad_'+x.id+'_impr',x.impressionLimit,'number')}${input('Click Limit','ad_'+x.id+'_click',x.clickLimit,'number')}${select('Placement','ad_'+x.id+'_placement',x.placement,['Search','Homepage','Category','Marketplace'])}</div><div class="ac-checks">${check('Approval Required','ad_'+x.id+'_approval',x.approval)}${check('Active','ad_'+x.id+'_active',x.active)}</div><button class="btn primary" onclick="adminAdPackageSave('${escv(x.id)}')">Save Ad Package</button></div>`).join('');
 const sections=c.sections.slice().sort((x,y)=>x.order-y.order).map(x=>`<div class="security-row"><div><b>${escv(x.name)}</b><div class="small muted">Order ${x.order}</div></div><div class="admin-actions"><button class="btn" onclick="adminSectionMove('${escv(x.id)}',-1)">↑</button><button class="btn" onclick="adminSectionMove('${escv(x.id)}',1)">↓</button><button class="btn ${x.enabled?'primary':'danger'}" onclick="adminSectionToggle('${escv(x.id)}')">${x.enabled?'ON':'OFF'}</button></div></div>`).join('');
 const hist=(c.configHistory||[]).slice(0,10).map(h=>`<div class="security-row"><div><b>${escv(h.reason)}</b><div class="small muted">${new Date(h.date).toLocaleString('en-IN')} · ${escv(h.adminId)}</div></div><button class="btn" onclick="adminRollbackConfig('${escv(h.version)}')">Rollback</button></div>`).join('')||'<div class="admin-empty">No configuration history yet.</div>';
 return adminLayout('control','Platform Control Center',`<div class="admin-kpis"><div class="admin-kpi"><span>Config Version</span><b>${escv(c.version)}</b></div><div class="admin-kpi"><span>Feature Flags</span><b>${Object.values(c.features).filter(Boolean).length}/${Object.keys(c.features).length}</b></div><div class="admin-kpi"><span>Plans</span><b>${c.plans.length}</b></div><div class="admin-kpi"><span>Ad Packages</span><b>${c.ads.packages.length}</b></div></div>
 <div class="admin-card"><div class="section-head"><div><h2>Commission Control</h2><div class="sub">Future transactions only. Historical order snapshots stay unchanged.</div></div></div><div class="form-grid">${input('Default %','acDef',co.defaultPct,'number')}${input('New Seller %','acNew',co.newSellerPct,'number')}${input('Premium %','acPrem',co.premiumPct,'number')}${input('Promotional %','acPromo',co.promotionalPct,'number')}${input('Temporary %','acTemp',co.temporaryPct,'number')}${input('Fixed Commission','acFixed',co.fixed,'number')}${input('Minimum %','acMin',co.min,'number')}${input('Maximum %','acMax',co.max,'number')}</div><button class="btn primary" onclick="adminControlSave('commission')">Save Commission</button></div>
 <div class="admin-card"><div class="section-head"><div><h2>Subscription Plans · 3 Plans</h2><div class="sub">Exactly three plans are shown publicly. Admin can edit price, commission, limits, feature switches and feature text.</div></div></div>${plans}</div>
 <div class="admin-card"><div class="section-head"><div><h2>Feature Control Center</h2><div class="sub">Toggle major features without editing source code.</div></div></div>${featureRows}</div>
 <div class="admin-card"><div class="section-head"><div><h2>Marketplace Rules</h2><div class="sub">Limits are applied to future actions where the prototype supports them.</div></div></div><div class="form-grid">${input('Minimum Product Price','acMinPrice',r.minProductPrice,'number')}${input('Maximum Product Price','acMaxPrice',r.maxProductPrice,'number')}${input('Product Upload Limit','acUploadLimit',r.productUploadLimit,'number')}${input('Max File Size MB','acFileSize',r.maxFileSizeMB,'number')}${input('Allowed File Types','acFileTypes',r.allowedFileTypes)}${input('Min Withdrawal','acMinWithdrawal',r.minWithdrawal,'number')}${input('Max Withdrawal','acMaxWithdrawal',r.maxWithdrawal,'number')}${input('Refund Window Days','acRefundWindow',r.refundWindowDays,'number')}${input('Order Cancel Hours','acCancelWindow',r.orderCancellationWindowHours,'number')}</div><div class="ac-checks">${check('Seller Verification Required','acSellerVerify',r.sellerVerificationRequired)}${check('Automatic Product Approval','acAutoApproval',r.automaticApproval)}${check('Manual Approval','acManualApproval',r.manualApproval)}</div><button class="btn primary" onclick="adminControlSave('rules')">Save Rules</button></div>
 <div class="admin-card"><h2>Payment Control</h2><div class="sub">Prototype only. Secrets never belong here.</div><div class="form-grid">${select('Gateway Status','acGatewayStatus',p.gatewayStatus,['TEST','DISABLED','MAINTENANCE'])}${select('Mode','acPayMode',p.mode,['TEST','LIVE'])}${select('Currency','acCurrency',p.currency,['INR','USD'])}${input('Timeout Minutes','acPayTimeout',p.timeoutMinutes,'number')}${input('Minimum Payment','acPayMin',p.minPayment,'number')}${input('Maximum Payment','acPayMax',p.maxPayment,'number')}</div><div class="ac-checks">${check('Automatic Verification','acAutoVerify',p.autoVerify)}${check('Manual Verification','acManualVerify',p.manualVerify)}</div><button class="btn danger" onclick="adminControlSave('payment')">Save Payment Control</button></div>
 <div class="admin-card"><h2>Payout / Withdrawal Control</h2><div class="form-grid">${input('Minimum','acPMin',po.min,'number')}${input('Maximum','acPMax',po.max,'number')}${input('Processing Fee %','acPPct',po.processingFeePct,'number')}${input('Fixed Fee','acPFixed',po.fixedFee,'number')}${select('Schedule','acPSchedule',po.schedule,['MANUAL','INSTANT','DAILY','WEEKLY'])}</div><div class="ac-checks">${check('Instant Payout','acInstant',po.instant)}${check('Daily','acDaily',po.daily)}${check('Weekly','acWeekly',po.weekly)}${check('Manual','acManual',po.manual)}${check('Verification Required','acPVerify',po.verificationRequired)}</div><button class="btn danger" onclick="adminControlSave('payout')">Save Payout Control</button></div>
 <div class="admin-card"><h2>Advertising Packages</h2>${ads}</div>
 <div class="admin-card"><h2>Referral Control</h2><div class="form-grid">${input('Buyer Reward','acBuyerReward',ref.buyerReward,'number')}${input('Seller Reward','acSellerReward',ref.sellerReward,'number')}${input('Referral Commission %','acRefPct',ref.commissionPct,'number')}${input('Max Monthly Reward','acRefMax',ref.maxMonthlyReward,'number')}${input('Expiration Days','acRefExp',ref.expirationDays,'number')}${select('Eligibility','acRefEligibility',ref.eligibility,['ALL','VERIFIED','SELLERS','BUYERS'])}</div><div class="ac-checks">${check('Referral System Enabled','acRefEnabled',ref.enabled)}</div><button class="btn primary" onclick="adminControlSave('referral')">Save Referral Control</button></div>
 <div class="admin-card"><h2>Seller-Specific Override</h2><div class="form-grid">${input('Seller ID','acSellerId','')}${input('Commission %','acSellerCommission',5,'number')}${select('Subscription','acSellerPlan','FREE',c.plans.map(x=>x.id))}${input('Product Limit','acSellerLimit','GLOBAL')}</div><div class="ac-checks">${check('Ads Enabled','acSellerAds',true)}${check('Withdrawal Enabled','acSellerWithdrawal',true)}${check('Featured Seller','acSellerFeatured',false)}${check('Analytics Enabled','acSellerAnalytics',true)}</div><button class="btn primary" onclick="adminSellerOverrideSave()">Save Seller Override</button></div>
 <div class="admin-card"><h2>Category Commission</h2><div class="form-grid">${input('Category Name','acCatName','')}${input('Commission %','acCatCommission',10,'number')}</div><button class="btn primary" onclick="adminCategoryCommissionSave()">Save Category Commission</button>${Object.entries(co.categoryOverrides||{}).map(([k,v])=>`<div class="security-row"><span>${escv(k)}</span><b>${escv(v)}%</b></div>`).join('')}</div>
 <div class="admin-card"><h2>Homepage Section Manager</h2><div class="sub">Enable/disable and reorder sections.</div>${sections}</div>
 <div class="admin-card"><h2>Website CMS / Branding</h2><div class="form-grid">${input('Website Name','acBrandName',b.websiteName)}${input('Primary Color','acPrimary',b.primaryColor)}${input('Secondary Color','acSecondary',b.secondaryColor)}${input('Font','acFont',b.font)}${input('Footer Copyright','acFooterCopy',b.footerCopyright)}${input('Contact Email','acContactEmail',b.contactEmail)}${input('Contact Info','acContactInfo',b.contactInfo)}${input('Email Sender Name','acSenderName',b.emailSenderName)}${input('Hero Title','acHeroTitle',cm.heroTitle)}${input('Hero Subtitle','acHeroSubtitle',cm.heroSubtitle)}${input('Hero Image URL','acHeroImage',cm.heroImage)}${input('CTA Text','acCta',cm.ctaText)}${input('CMS Footer','acCmsFooter',cm.footer)}</div><button class="btn primary" onclick="adminControlSave('branding');adminControlSave('cms')">Save Website Controls</button></div>
 <div class="admin-card"><h2>Global Announcement</h2><div class="form-grid">${input('Title','acAnnTitle',a.title)}${input('Start Date','acAnnStart',a.startDate,'date')}${input('End Date','acAnnEnd',a.endDate,'date')}${select('Audience','acAnnAudience',a.audience,['Everyone','Buyers','Sellers','Premium Sellers','Specific Users'])}</div><div class="field"><label>Message</label><textarea id="acAnnMessage">${escv(a.message)}</textarea></div><div class="ac-checks">${check('Announcement Active','acAnnEnabled',a.enabled)}</div><button class="btn primary" onclick="adminControlSave('announcement')">Save Announcement</button></div>
 <div class="admin-card"><div class="section-head"><div><h2>Configuration History / Rollback</h2><div class="sub">Important changes keep snapshots for rollback.</div></div></div>${hist}</div>
 <div class="admin-card"><h2>Exports</h2><div class="admin-actions">${['users','sellers','products','orders','payouts','ads'].map(k=>`<button class="btn" onclick="adminExportData('${k}')">Export ${k.toUpperCase()} CSV</button>`).join('')}<button class="btn" onclick="window.print()">Print / Save PDF</button></div></div>
 <div class="admin-card"><h2>Security Architecture</h2><p class="muted">Frontend controls are not the final authorization boundary. Production must enforce role permissions, RLS, payment verification, idempotency, rate limits and secret isolation on the server.</p></div>`)};
 // Make existing seller fee calculation consult configured category/seller overrides for future orders only.
 const originalEffective=window.effectivePlatformFeeRate;
 window.effectivePlatformFeeRate=function(sid,when){const c=pc(),ss=S.sellers?.[sid];if(ss?.manualCommissionPct!=null&&!isNaN(Number(ss.manualCommissionPct)))return Math.min(1,Math.max(0,Number(ss.manualCommissionPct)/100));const catProduct=(S.products||[]).find(x=>x.sellerId===sid);if(catProduct&&c.commission.categoryOverrides?.[catProduct.category]!=null)return Math.min(1,Math.max(0,Number(c.commission.categoryOverrides[catProduct.category])/100));return originalEffective?originalEffective(sid,when):Number(c.commission.defaultPct||20)/100};
 // Apply configurable withdrawal limits to existing payout request function via a wrapper only where source exposes the original function.
 const originalRequestPayout=window.requestPayout;
 if(originalRequestPayout)window.requestPayout=function(){if(!systemGuard('withdrawals','Withdrawals are temporarily disabled by Admin'))return;const s=currentSeller();if(!s)return;const amount=Number(document.getElementById('payoutAmount')?.value||0);const c=pc().payout,rr=pc().rules||{};const effectiveMin=Math.max(Number(c.min||0),Number(rr.minWithdrawal||0));const effectiveMax=Math.min(Number(c.max||1e15),Number(rr.maxWithdrawal||1e15));if(amount<effectiveMin){toast('Minimum payout is '+money(c.min));return}if(amount>effectiveMax){toast('Maximum payout is '+money(effectiveMax));return}return originalRequestPayout.apply(this,arguments)};
 // Feature flags for messaging/wishlist/reviews/coupons etc. Reuse existing systemGuard calls where present.
 window.controlOff=function(k){const legacy=advState();if(legacy&&legacy[k]===true)return true;const c=pc(),f=c.features||{};const map={newSellerRegistration:'sellerRegistration',buyerRegistration:'buyerRegistration',productUploads:'productUpload',productUpload:'productUpload',productApproval:'productApproval',sellerAds:'sellerAds',ads:'sellerAds',withdrawals:'withdrawals',payments:'payments',referrals:'referrals',reviews:'reviews',messaging:'messaging',wishlist:'wishlist',coupons:'coupons',refunds:'refunds',disputes:'disputes',notifications:'notifications',sellerAnalytics:'sellerAnalytics',productAnalytics:'productAnalytics',subscriptions:'subscriptions'};const featureKey=map[k]||k;return Object.prototype.hasOwnProperty.call(f,featureKey)?f[featureKey]===false:false};
 window.systemGuard=function(key,message){if(window.controlOff(key)){toast(message||'This feature is disabled by Admin');return false}return true};
})();

let mailTab='inbox',mailSelected=null;
function mailStore(){
  S.mailMessages=Array.isArray(S.mailMessages)?S.mailMessages:[];
  return S.mailMessages;
}
function mailSeed(){
  const a=mailStore();
  if(a.length)return;
  a.push({id:uid('mail'),type:'system',from:'Sale Earn',fromEmail:cfg().branding?.contactEmail||'',to:S.currentUser?.email||'',subject:'Welcome to Sale Earn Mail Center',body:'Your internal Sale Earn messages will appear here. Authentication OTP emails are delivered by Supabase Auth to the user’s email inbox.',date:nowISO(),read:false,starred:false});
}
window.mailOpen=function(id){mailSelected=id;const m=mailStore().find(x=>x.id===id);if(m){m.read=true;save();}render();};
window.mailBack=function(){mailSelected=null;render();};
window.mailTab=function(tab){mailTab=tab;mailSelected=null;render();};
window.mailDelete=function(id){if(!adminOnly())return;S.mailMessages=mailStore().filter(x=>x.id!==id);mailSelected=null;save();render();};
window.mailToggleStar=function(id){if(!adminOnly())return;const m=mailStore().find(x=>x.id===id);if(!m)return;m.starred=!m.starred;save();render();};
window.mailCompose=function(){
  if(!adminOnly())return;
  const users=(S.users||[]).filter(u=>u.email).map(u=>`<option value="${esc(u.email)}">${esc(u.name||u.email)} — ${esc(u.email)}</option>`).join('');
  document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal mail-compose-modal"><button class="btn iconbtn close" onclick="closeModal()">×</button><div class="mail-compose-head"><span class="mail-big-icon">✉</span><div><h2 style="margin:0">Compose message</h2><p class="muted" style="margin:4px 0 0">Send an internal message to a Sale Earn user.</p></div></div><div class="field"><label>Recipient</label><select id="mailTo"><option value="">Choose a user</option>${users}</select></div><div class="field"><label>Subject</label><input id="mailSubject" maxlength="160" placeholder="Message subject"></div><div class="field"><label>Message</label><textarea id="mailBody" maxlength="5000" placeholder="Write your message..."></textarea></div><div class="mail-compose-note">This Mail Center stores messages inside Sale Earn. Supabase Auth OTP emails continue to use the SMTP sender configured in Supabase.</div><div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="mailSend()">Send message</button></div></div></div>`;

window.mailSend=function(){
  if(!adminOnly())return;

window.mailReply=function(id){if(!adminOnly())return;const src=mailStore().find(x=>x.id===id);if(!src)return toast('Message not found');document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal mail-compose-modal"><button class="btn iconbtn close" onclick="closeModal()">×</button><div class="mail-compose-head"><span class="mail-big-icon">↩</span><div><h2 style="margin:0">Reply to ${esc(src.from||'User')}</h2><p class="muted" style="margin:4px 0 0">${esc(src.subject||'Support message')}</p></div></div><div class="field"><label>Subject</label><input id="mailReplySubject" maxlength="160" value="${esc(/^re:/i.test(src.subject||'')?src.subject:'Re: '+(src.subject||'Support message'))}"></div><div class="field"><label>Reply</label><textarea id="mailReplyBody" maxlength="5000" placeholder="Write your reply..."></textarea></div><div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="mailSendReply('${esc(id)}')">Send Reply</button></div></div></div>`};

function mailPanel(){
  mailSeed();
  const all=mailStore().slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
  const selected=mailSelected?all.find(x=>x.id===mailSelected):null;
  const unread=all.filter(x=>!x.read&&x.type!=='sent').length;
  const inbox=all.filter(x=>x.type!=='sent');
  const sent=all.filter(x=>x.type==='sent');
  const active=mailTab==='sent'?sent:inbox;
  const rows=active.map(m=>`<button class="mail-row ${m.read?'':'unread'} ${selected?.id===m.id?'selected':''}" onclick="mailOpen('${esc(m.id)}')"><span class="mail-avatar">${esc(initials(m.type==='sent'?m.to:m.from))}</span><span class="mail-row-main"><strong>${esc(m.type==='sent'?'To: '+m.to:(m.from||'Sale Earn'))}</strong><span>${esc(m.subject||'(No subject)')}</span><small>${esc(String(m.body||'').replace(/\s+/g,' ').slice(0,95))}</small></span><span class="mail-row-side"><button class="mail-star ${m.starred?'on':''}" onclick="event.stopPropagation();mailToggleStar('${esc(m.id)}')" aria-label="Star">${m.starred?'★':'☆'}</button><small>${when(m.date)}</small></span></button>`).join('')||`<div class="mail-empty"><div class="mail-empty-icon">✉</div><h3>No messages</h3><p>${mailTab==='sent'?'Sent messages will appear here.':'Your inbox is clear.'}</p></div>`;

  return adminLayout('mail','Mail Center',`${titleBlock('COMMUNICATION','Mail Center','A clean internal message center for Sale Earn users and admin communication.')}<div class="mail-shell"><aside class="mail-sidebar"><button class="mail-compose-btn" onclick="mailCompose()">✎ Compose</button><button class="mail-nav ${mailTab==='inbox'?'active':''}" onclick="mailTab('inbox')">✉ Inbox ${unread?`<span>${unread}</span>`:''}</button><button class="mail-nav ${mailTab==='sent'?'active':''}" onclick="mailTab('sent')">↗ Sent <span>${sent.length}</span></button><div class="mail-info-card"><strong>SMTP connected</strong><p>Auth OTP delivery is handled securely by Supabase SMTP.</p><small>${esc(cfg().branding?.emailSenderName||'Sale Earn')}</small></div></aside><section class="mail-main">${detail}</section></div>`);
}

const configuredPaymentOpen=window.openPayment;
window.openPayment=function(){const r=configuredPaymentOpen();const methods=cfg().payment.methods||[];if(methods.length&&!methods.includes(window.payMethod)){const next=methods[0],btn=[...document.querySelectorAll('.pay-opt')].find(b=>b.textContent.includes(next));if(btn)selectPay(btn,next);}return r;};
for(const action of ['testPay','completeServiceOnline','completeReferralUpgradeOnline']){const f=window[action];if(f)window[action]=function(...args){if(!systemGuard('payments')||!(cfg().payment.methods||[]).includes(window.payMethod))return toast('Select an enabled test payment method.');return f(...args);};}

/* Preserve the scrollable NAV, not its non-scrolling outer sidebar. */
(function(){
 let navPosition=0,navOwner='',generation=0;
 function storageKey(){return 'SE_ADMIN_NAV_SCROLL_V2_'+String(S.currentUser?.id||'guest');}
 function readPosition(){try{return Math.max(0,Number(sessionStorage.getItem(storageKey()))||0);}catch(e){return 0;}}
 function remember(nav){if(!nav)return;navPosition=nav.scrollTop;navOwner=storageKey();try{sessionStorage.setItem(navOwner,String(navPosition));}catch(e){}}
 document.addEventListener('scroll',function(e){if(e.target instanceof Element&&e.target.matches('.as-nav')&&e.target.isConnected)remember(e.target);},true);
 const priorRender=window.render;
 window.render=function(...args){
  document.body.classList.toggle('se-market',route()==='market');
  const oldNav=document.querySelector('.as-nav');
  if(oldNav)remember(oldNav);else if(navOwner!==storageKey()){navOwner=storageKey();navPosition=readPosition();}
  const wanted=navPosition,token=++generation;
  const result=priorRender.apply(this,args);
  const newNav=document.querySelector('.as-nav');
  if(newNav){newNav.scrollTop=wanted;requestAnimationFrame(()=>{if(token===generation&&newNav.isConnected)newNav.scrollTop=wanted;});}
  return result;
 };
 // Retain existing product actions/data, but place cart actions in their own row.
 const priorCard=window.productCard;
 window.productCard=function(p){const html=priorCard(p);if(route()!=='market')return html;
  const t=document.createElement('template');t.innerHTML=html;
  const body=t.content.querySelector('.body'),title=t.content.querySelector('h3');
  if(body){body.firstElementChild?.classList.add('market-card-tags');title?.nextElementSibling?.classList.add('market-card-price');
   const actions=body.lastElementChild;actions.classList.add('market-card-actions');
   const cart=t.content.querySelector('.plus');if(cart){cart.setAttribute('aria-label','Add '+String(p.title||'product')+' to cart');cart.title='Add to cart';actions.append(cart);}
  }
  if(title)title.title=String(p.title||'');
  const save=t.content.querySelector('.save-product');if(save)save.setAttribute('aria-label',save.title||'Save product');
  const image=t.content.querySelector('.thumb img');if(image){image.alt=String(p.title||'Product preview');image.loading='lazy';image.decoding='async';}
  return t.innerHTML;
 };
})();

render();restoreSupabaseSession();
})();
</script>

<script id="saleearn-admin-user-delete-and-mobile">
(function(){
  const escx=v=>typeof esc==='function'?esc(v):String(v??'');
  function userMoney(id,sid){return sid&&typeof sellerAvailableBalance==='function'?Math.max(0,Number(sellerAvailableBalance(sid)||0)):0}
  window.adminDeleteUser=function(id){
    if(!adminOnly())return;
    const u=(S.users||[]).find(x=>String(x.id)===String(id)); if(!u||u.isAdmin){toast('Admin account cannot be deleted');return;}
    const sid=u.sellerId||null, amount=userMoney(u.id,sid);
    window.__saleEarnDeleteUser=async function(){
      const now=nowISO(), productIds=new Set((S.products||[]).filter(p=>String(p.sellerId)===String(sid)).map(p=>String(p.id)));
      if(amount>0){
        S.adminCommissionAdjustments=S.adminCommissionAdjustments||[];S.adminFinancialLedger=S.adminFinancialLedger||[];
        const entry={id:uid('fin'),type:'USER_DELETE_BALANCE_TRANSFER',userId:u.id,sellerId:sid,amount,date:now,status:'POSTED',reason:'Remaining available seller balance transferred to platform commission'};
        S.adminCommissionAdjustments.unshift(entry);S.adminFinancialLedger.unshift({...entry,source:'USER_DELETION'});
      }
      const before={userId:u.id,sellerId:sid,amount,products:productIds.size};
      S.products=(S.products||[]).filter(p=>!productIds.has(String(p.id)));
      S.deletedProducts=(S.deletedProducts||[]).filter(p=>!productIds.has(String(p.id)));
      S.orders=(S.orders||[]).filter(x=>String(x.customerId)!==String(u.id)&&String(x.sellerId)!==String(sid));
      S.payouts=(S.payouts||[]).filter(x=>String(x.userId||'')!==String(u.id)&&String(x.sellerId||'')!==String(sid));
      S.subscriptions=(S.subscriptions||[]).filter(x=>String(x.userId||'')!==String(u.id)&&String(x.sellerId||'')!==String(sid));
      S.ads=(S.ads||[]).filter(x=>String(x.userId||'')!==String(u.id)&&String(x.sellerId||'')!==String(sid));
      S.referrals=(S.referrals||[]).filter(x=>String(x.userId||'')!==String(u.id)&&String(x.sellerId||'')!==String(sid)&&String(x.referrerId||'')!==String(u.id));
      S.warnings=(S.warnings||[]).filter(x=>String(x.userId||'')!==String(u.id)&&String(x.sellerId||'')!==String(sid));
      S.devices=(S.devices||[]).filter(x=>String(x.userId||'')!==String(u.id));
      S.balancePayments=(S.balancePayments||[]).filter(x=>String(x.userId||'')!==String(u.id)&&String(x.sellerId||'')!==String(sid));
      S.drafts=(S.drafts||[]).filter(x=>String(x.userId||'')!==String(u.id)&&String(x.sellerId||'')!==String(sid));
      S.productActivity=(S.productActivity||[]).filter(x=>String(x.userId||'')!==String(u.id)&&String(x.sellerId||'')!==String(sid)&&!productIds.has(String(x.productId||'')));
      S.notifications=(S.notifications||[]).filter(x=>String(x.userId||'')!==String(u.id)&&String(x.sellerId||'')!==String(sid));
      S.messages=(S.messages||[]).filter(x=>String(x.userId||'')!==String(u.id)&&String(x.senderId||'')!==String(u.id)&&String(x.receiverId||'')!==String(u.id));
      S.disputes=(S.disputes||[]).filter(x=>String(x.userId||'')!==String(u.id)&&String(x.sellerId||'')!==String(sid));
      S.refunds=(S.refunds||[]).filter(x=>String(x.userId||'')!==String(u.id)&&String(x.sellerId||'')!==String(sid));
      S.couponRedemptions=(S.couponRedemptions||[]).filter(x=>String(x.userId||'')!==String(u.id));
      if(S.cart&&Array.isArray(S.cart))S.cart=S.cart.filter(x=>String(x.userId||'')!==String(u.id));
      if(S.saved&&Array.isArray(S.saved))S.saved=S.saved.filter(x=>String(x.userId||'')!==String(u.id));
      if(S.library&&Array.isArray(S.library))S.library=S.library.filter(x=>String(x.userId||'')!==String(u.id));
      if(S.reviews&&typeof S.reviews==='object'){for(const pid of Object.keys(S.reviews)){if(productIds.has(String(pid))){delete S.reviews[pid];continue}if(Array.isArray(S.reviews[pid]))S.reviews[pid]=S.reviews[pid].filter(r=>String(r.userId||r.authorId||r.customerId||'')!==String(u.id));}}
      if(S.follows&&typeof S.follows==='object'&&!Array.isArray(S.follows)){delete S.follows[u.id];delete S.follows[sid];for(const k of Object.keys(S.follows)){if(Array.isArray(S.follows[k]))S.follows[k]=S.follows[k].filter(x=>String(x)!==String(u.id)&&String(x)!==String(sid));}}
      delete S.sellers[sid];
      S.users=S.users.filter(x=>String(x.id)!==String(u.id));
      logAdminAudit('Deleted user and transferred remaining balance',u.id,{sellerId:sid,amount,deleted:before});
      adminAudit('User deletion completed',u.id,{sellerId:sid,amount});
      save();
      let authDelete=false;
      try{if(window.supabaseClient?.rpc){const r=await supabaseClient.rpc('se_admin_delete_user',{target_user_id:u.authId||u.user_id||u.id});authDelete=!r.error;if(r.error)console.warn('Auth deletion RPC unavailable:',r.error.message);}}catch(e){console.warn('Auth deletion skipped:',e)}
      toast(authDelete?'User fully deleted and balance transferred to commission':'User data deleted and balance transferred; Auth account still needs the secure server-side delete RPC');
      render();
    };
    adminConfirm('Delete this user permanently?',`This removes the user's marketplace data, seller/store data, products, orders, payouts and related records. Remaining Available To Receive ${money(amount)} is posted to Admin Commission with a permanent financial audit record. This cannot be undone.`,'window.__saleEarnDeleteUser()','Delete User');
  };
  window.adminUsers=function(){
    const rows=(S.users||[]).filter(u=>u&&!u.isAdmin&&String(u.id||'').trim()&&String(u.email||'').trim());
    return adminLayout('users','Users & Sellers',`<div class="admin-card"><div class="section-head"><div><h2>All Users</h2><div class="sub">Restrict or permanently remove an account. Financial transfers are logged before deletion.</div></div></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>User</th><th>Email</th><th>Store</th><th>Orders</th><th>Available</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(u=>{const oo=S.orders.filter(x=>x.customerId===u.id),sid=u.sellerId,ss=sid?seller(sid):null,restricted=u.unpublicUntil&&u.unpublicUntil>Date.now(),amt=userMoney(u.id,sid);return `<tr class="data-row"><td onclick="adminNav('user/${escx(u.id)}')"><b>${escx(u.id)}</b><div>${escx(u.name)}</div></td><td>${escx(u.email)}</td><td>${ss?escx(ss.name):'-'}</td><td>${oo.length}</td><td>${money(amt)}</td><td><span class="admin-pill ${restricted?'danger':'success'}">${restricted?'Restricted':'Active'}</span></td><td><div class="admin-actions" onclick="event.stopPropagation()"><button class="btn ${restricted?'primary':''}" onclick="${restricted?`adminRelease('${escx(u.id)}')`:`adminRestrict('${escx(u.id)}')`}">${restricted?'Release':'Restrict'}</button><button class="btn danger" onclick="adminDeleteUser('${escx(u.id)}')">Delete User</button></div></td></tr>`}).join('')||`<tr><td colspan="7"><div class="admin-empty">No users found.</div></td></tr>`}</tbody></table></div></div>`);
  };
})();
</script>

<script>
/* SaleEarn Admin User Delete Control */
(function(){
  function addAdminDeleteTools(){
    const areas = document.querySelectorAll('.admin-card,.admin-table-wrap,.admin-content,.admin-main');
    areas.forEach(area=>{
      if(area.querySelector('.se-delete-user-tool')) return;
      const box=document.createElement('div');
      box.className='se-delete-user-tool';
      box.style.cssText='margin-top:16px;padding:14px;border-radius:14px;background:#fff;border:1px solid #eee;';
      box.innerHTML=`
        <b>Danger Zone - User Account</b>
        <p style="margin:8px 0;color:#666">Admin can permanently delete a user account after confirmation.</p>
        <input id="seDeleteUserId" placeholder="Enter User ID" style="padding:10px;width:100%;border-radius:8px;border:1px solid #ddd">
        <button id="seDeleteUserBtn" style="margin-top:10px;padding:10px 16px;border:0;border-radius:8px;background:#dc2626;color:white;cursor:pointer">
        Delete User
        </button>`;
      area.appendChild(box);
    });
    const btn=document.getElementById('seDeleteUserBtn');
    if(btn && !btn.dataset.ready){
      btn.dataset.ready="1";
      btn.onclick=async()=>{
        const id=document.getElementById('seDeleteUserId').value.trim();
        if(!id) return alert('User ID required');
        if(!confirm('Are you sure? User data will be permanently deleted.')) return;
        alert('Delete request prepared. Connect this button with delete-account Edge Function.');
      };
    }
  }
  setTimeout(addAdminDeleteTools,1500);
})();

<script id="saleearn-admin-control-save-fix-script">

  if(typeof seStopped!=='undefined'&&seStopped){seStopped=false;seFailures=0;seRetryAt=0}
  for(let i=0;i<4;i++){
   while((typeof seWriteBusy!=='undefined'&&seWriteBusy)||(typeof seReadBusy!=='undefined'&&seReadBusy))await wait(120);
   if(typeof ONLINE_LOCAL_DIRTY!=='undefined'&&!ONLINE_LOCAL_DIRTY)return {live:true};
   try{await pushOnlineState()}catch(e){return {live:false,reason:e?.message||'Cloud save failed'}}
   if(typeof ONLINE_LOCAL_DIRTY==='undefined'||!ONLINE_LOCAL_DIRTY)return {live:true};

 }

<script id="saleearn-marketplace-controls-v19-script">
(function(){
const BADGES=['New','Old','Latest','Buy Now','For You','Limited','Best Seller','Trending','Hot Deal','Popular','Editor Pick','Exclusive','Premium','Featured','Top Rated','Viral','Must Buy','Sale','Offer','Recommended','Instant Access','Updated','Beginner Friendly','Pro Choice','Value Pack','Limited Time','Back in Stock','Bestseller','Staff Pick','Customer Favorite','Early Access','Bonus Included'];
function state(){const sid=currentSeller()?.id||S.currentUser?.sellerId||'guest';S.badgeLedgers=S.badgeLedgers&&typeof S.badgeLedgers==='object'?S.badgeLedgers:{};S.badgeLedgers[sid]=S.badgeLedgers[sid]||{freeLimit:3,price:3,credits:0,placedProductIds:[],purchases:[]};S.downloadEvents=S.downloadEvents||[];S.serviceRefunds=S.serviceRefunds||[];return S.badgeLedgers[sid]}
function spec(b){return b||null}function badgeHTML(p){const b=spec(p?.badge);if(!b?.text)return'';return `<span class="product-badge ${esc(b.shape||'pill')}" style="--badge-bg:${esc(b.bg||'#5146e5')};--badge-text:${esc(b.textColor||'#fff')};--badge-border:${esc(b.border||'#fff')};--badge-font:${esc(b.font||'Inter')}">${esc(b.text)}</span>`}
const oldCard=productCard;productCard=function(p){let h=oldCard(p);return h.replace(/(<article class="product-card[^>]*>)/,`$1${badgeHTML(p)}`)};
function usedFree(){return Math.min(3,state().placedProductIds.length)}function canNewBadge(){return usedFree()<3||state().credits>0}
window.openBadgeDesigner=function(editId=''){const d=editId?product(editId):S.draft||{},b=d.badge||{text:'New',bg:'#5146e5',textColor:'#fff',border:'#fff',font:'Inter',shape:'pill'};window.badgeEditId=editId;document.getElementById('modalRoot').innerHTML=`<div class="modal-bg"><div class="modal"><button class="btn iconbtn close" onclick="closeModal()">×</button><h2>Product Badge Designer</h2><div class="badge-credit-bar"><div class="trust-item"><small>Free used</small><b>${usedFree()}/3</b></div><div class="trust-item"><small>Paid credits</small><b>${state().credits}/100</b></div><div class="trust-item"><small>Price</small><b>₹3 each</b></div><div class="trust-item"><small>Per product</small><b>1 badge</b></div></div><div class="field"><label>Search badge</label><input id="badgeSearch" placeholder="Search New, Limited, Trending..." oninput="filterBadgeLibrary(this.value)"></div><div id="badgeLibrary" class="badge-library">${BADGES.map(x=>`<button class="badge-choice ${x===b.text?'active':''}" data-name="${esc(x.toLowerCase())}" onclick="selectBadgeText('${esc(x)}')">${esc(x)}</button>`).join('')}</div><div class="form-grid badge-designer"><div class="field"><label>Badge text</label><input id="badgeText" maxlength="24" value="${esc(b.text)}" oninput="badgePreview()"></div><div class="field"><label>Shape</label><select id="badgeShape" onchange="badgePreview()">${['pill','rounded','square','ribbon'].map(x=>`<option ${b.shape===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Background</label><input id="badgeBg" type="color" value="${esc(b.bg)}" oninput="badgePreview()"></div><div class="field"><label>Text color</label><input id="badgeTextColor" type="color" value="${esc(b.textColor)}" oninput="badgePreview()"></div><div class="field"><label>Border color</label><input id="badgeBorder" type="color" value="${esc(b.border)}" oninput="badgePreview()"></div><div class="field"><label>Font</label><select id="badgeFont" onchange="badgePreview()">${['Inter','Arial','Verdana','Georgia','Trebuchet MS'].map(x=>`<option ${b.font===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div id="badgePreview" class="badge-preview"></div><div class="modal-footer"><button class="btn" onclick="removeProductBadge()">Remove</button><button class="btn" onclick="openBadgeCredits()">Buy credits</button><button class="btn primary" onclick="saveProductBadge()">Apply Badge</button></div></div></div>`;badgePreview()};
window.filterBadgeLibrary=q=>document.querySelectorAll('.badge-choice').forEach(x=>x.hidden=!x.dataset.name.includes(String(q).toLowerCase()));window.selectBadgeText=t=>{document.getElementById('badgeText').value=t;document.querySelectorAll('.badge-choice').forEach(x=>x.classList.toggle('active',x.textContent===t));badgePreview()};window.badgePreview=()=>{const e=document.getElementById('badgePreview');if(e)e.innerHTML=`<span class="product-badge ${document.getElementById('badgeShape').value}" style="position:relative;top:auto;left:auto;--badge-bg:${document.getElementById('badgeBg').value};--badge-text:${document.getElementById('badgeTextColor').value};--badge-border:${document.getElementById('badgeBorder').value};--badge-font:${document.getElementById('badgeFont').value}">${esc(document.getElementById('badgeText').value||'Badge')}</span>`};
function readBadge(){return{text:(document.getElementById('badgeText')?.value||'').trim(),shape:document.getElementById('badgeShape')?.value||'pill',bg:document.getElementById('badgeBg')?.value||'#5146e5',textColor:document.getElementById('badgeTextColor')?.value||'#fff',border:document.getElementById('badgeBorder')?.value||'#fff',font:document.getElementById('badgeFont')?.value||'Inter'}}

const prePublish=window.publishProduct;window.publishProduct=function(id){const d=S.draft||{},before=new Set(S.products.map(x=>x.id));if(d.badge&&!id&&!canNewBadge())return toast('Buy badge credits before publishing with a badge');const r=prePublish(id);const p=id?product(id):S.products.find(x=>!before.has(x.id));if(p?.badge&&!state().placedProductIds.includes(p.id)){if(usedFree()>=3)state().credits=Math.max(0,state().credits-1);state().placedProductIds.push(p.id);save()}return r};

<script id="saleearn-v21-script">
(function(){

const DAY=86400000;
function v21Init(){
 S.messages=Array.isArray(S.messages)?S.messages:[];

}
v21Init();
const snapshot20=onlineSnapshot;onlineSnapshot=function(){v21Init();return {...snapshot20(),messageThreads:S.messageThreads,messagePacks:S.messagePacks,messageSettings:S.messageSettings}};
function safeHttpUrl(v){try{const u=new URL(String(v||''));return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return''}}
function todayKey(v=Date.now()){const d=new Date(v);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

window.v21InputCount=inputCount;

// ---------- Product badge studio ----------
function v21BadgeHTML(p){const b=p?.badge;if(!b?.text)return'';const vertical=b.vertical==='bottom'?'bottom':'top',horizontal=b.horizontal==='right'?'right':'left',texture=['solid','gradient','stripes','dots','shine'].includes(b.texture)?b.texture:'gradient';return `<span class="product-badge ${esc(b.shape||'pill')} badge-${vertical} badge-${horizontal} texture-${texture}" style="--badge-bg:${esc(b.bg||'#5146e5')};--badge-text:${esc(b.textColor||'#fff')};--badge-border:${esc(b.border||'#fff')};--badge-font:${esc(b.font||'Inter')}">${esc(b.text)}</span>`};
function v21ReadBadge(){return{text:(document.getElementById('badgeText')?.value||'').trim().slice(0,24),shape:document.getElementById('badgeShape')?.value||'pill',texture:document.getElementById('badgeTexture')?.value||'gradient',vertical:document.getElementById('badgeVertical')?.value||'top',horizontal:document.getElementById('badgeHorizontal')?.value||'left',bg:document.getElementById('badgeBg')?.value||'#5146e5',textColor:document.getElementById('badgeTextColor')?.value||'#fff',border:document.getElementById('badgeBorder')?.value||'#fff',font:document.getElementById('badgeFont')?.value||'Inter'}};
function v21BadgeState(){const sid=currentSeller()?.id||S.currentUser?.sellerId||'guest';S.badgeLedgers=S.badgeLedgers||{};return S.badgeLedgers[sid]||(S.badgeLedgers[sid]={freeLimit:3,price:3,credits:0,placedProductIds:[],purchases:[]})}
function v21UsedFree(){return Math.min(3,v21BadgeState().placedProductIds.length)}
window.saveProductBadge=function(){const id=window.badgeEditId,target=id?product(id):(S.draft=S.draft||{}),b=v21ReadBadge();if(!target)return;if(!b.text)return toast('Badge text is required');const st=v21BadgeState();if(id&&!target.badge&&!st.placedProductIds.includes(id)){if(st.placedProductIds.length>=3&&st.credits<=0)return toast('Buy badge credits first');if(st.placedProductIds.length>=3)st.credits--;st.placedProductIds.push(id)}target.badge=b;save();closeModal();toast('Badge applied');render()};
window.badgePreview=function(){const e=document.getElementById('badgePreview');if(!e)return;const b=v21ReadBadge();e.innerHTML=`<div class="badge-stage"><span class="product-badge ${esc(b.shape)} badge-${esc(b.vertical)} badge-${esc(b.horizontal)} texture-${esc(b.texture)}" style="--badge-bg:${esc(b.bg)};--badge-text:${esc(b.textColor)};--badge-border:${esc(b.border)};--badge-font:${esc(b.font)}">${esc(b.text||'Badge')}</span></div>`};
window.openBadgeDesigner=function(editId=''){const d=editId?product(editId):S.draft||{},b={text:'New',bg:'#654ee8',textColor:'#fff',border:'#fff',font:'Inter',shape:'pill',texture:'gradient',vertical:'top',horizontal:'left',...(d.badge||{})};window.badgeEditId=editId;document.getElementById('modalRoot').innerHTML=`<div class="modal-bg"><div class="modal"><button class="btn iconbtn close" onclick="closeModal()">×</button><h2>Product Badge Studio</h2><p class="muted">Responsive image badge · one saved design is used in Step 1, Step 3 and product cards.</p><div class="badge-credit-bar"><div class="trust-item"><small>Free used</small><b>${v21UsedFree()}/3</b></div><div class="trust-item"><small>Credits</small><b>${v21BadgeState().credits}/100</b></div><div class="trust-item"><small>Extra</small><b>₹3</b></div><div class="trust-item"><small>Per product</small><b>1</b></div></div><div class="field"><label>Search badge</label><input id="badgeSearch" maxlength="30" placeholder="New, Limited, Trending" oninput="filterBadgeLibrary(this.value)"></div><div id="badgeLibrary" class="badge-library">${BADGES.map(x=>`<button class="badge-choice ${x===b.text?'active':''}" data-name="${esc(x.toLowerCase())}" onclick="selectBadgeText('${esc(x)}')">${esc(x)}</button>`).join('')}</div><div class="form-grid badge-designer"><div class="field"><label>Badge text</label><input id="badgeText" maxlength="24" value="${esc(b.text)}" oninput="badgePreview()"></div><div class="field"><label>Shape</label><select id="badgeShape" onchange="badgePreview()">${['pill','rounded','square','ribbon'].map(x=>`<option value="${x}" ${b.shape===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Texture</label><select id="badgeTexture" onchange="badgePreview()">${['solid','gradient','stripes','dots','shine'].map(x=>`<option value="${x}" ${b.texture===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Image position</label><select id="badgeVertical" onchange="badgePreview()"><option value="top" ${b.vertical==='top'?'selected':''}>Top of image</option><option value="bottom" ${b.vertical==='bottom'?'selected':''}>Bottom of image</option></select></div><div class="field"><label>Side</label><select id="badgeHorizontal" onchange="badgePreview()"><option value="left" ${b.horizontal==='left'?'selected':''}>Left</option><option value="right" ${b.horizontal==='right'?'selected':''}>Right</option></select></div><div class="field"><label>Font</label><select id="badgeFont" onchange="badgePreview()">${['Inter','Arial','Verdana','Georgia','Trebuchet MS'].map(x=>`<option ${b.font===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Main colour</label><input id="badgeBg" type="color" value="${esc(b.bg)}" oninput="badgePreview()"></div><div class="field"><label>Text colour</label><input id="badgeTextColor" type="color" value="${esc(b.textColor)}" oninput="badgePreview()"></div><div class="field"><label>Border colour</label><input id="badgeBorder" type="color" value="${esc(b.border)}" oninput="badgePreview()"></div></div><div id="badgePreview" class="badge-form-preview"></div><div class="modal-footer"><button class="btn" onclick="removeProductBadge()">Remove</button><button class="btn" onclick="openBadgeCredits()">Buy credits</button><button class="btn primary" onclick="saveProductBadge()">Apply Badge</button></div></div></div>`;badgePreview()};
const productCard20=productCard;productCard=function(p){const html=productCard20(p),tpl=document.createElement('template');tpl.innerHTML=html;const card=tpl.content.querySelector('.product-card'),badge=card?.querySelector(':scope > .product-badge'),thumbEl=card?.querySelector('.thumb'),b=p?.badge||{};if(badge&&thumbEl){badge.className='product-badge '+esc(b.shape||'pill')+' badge-'+(b.vertical==='bottom'?'bottom':'top')+' badge-'+(b.horizontal==='right'?'right':'left')+' texture-'+(['solid','gradient','stripes','dots','shine'].includes(b.texture)?b.texture:'gradient');badge.style.cssText='--badge-bg:'+esc(b.bg||'#5146e5')+';--badge-text:'+esc(b.textColor||'#fff')+';--badge-border:'+esc(b.border||'#fff')+';--badge-font:'+esc(b.font||'Inter');thumbEl.appendChild(badge)};return tpl.innerHTML};
function v21InjectBadge(){const r=route();if(!/dashboard\/(add$|add3|edit\/)/.test(r))return;const form=document.querySelector('.dash-form');if(!form||form.querySelector('.badge-builder-entry'))return;const id=r.startsWith('dashboard/edit/')?r.split('/')[2]:'';const target=id?product(id):S.draft;const card=`<div class="dash-card badge-builder-entry"><h3>Product Badge</h3><p class="muted">Same badge preview is connected across Product Information and Pricing.</p><div class="badge-form-preview">${target?.badge?`<div class="badge-stage">${v21BadgeHTML(target)}</div>`:'<span class="muted">No badge selected</span>'}</div><button type="button" class="btn primary" onclick="openBadgeDesigner('${esc(id)}')">Choose / Design Badge</button></div>`;if(r.includes('add3')){const footer=form.querySelector('.modal-footer');footer?.insertAdjacentHTML('beforebegin',card)}else{const footer=form.querySelector('.modal-footer');footer?.insertAdjacentHTML('beforebegin',card)}};

// ---------- Product validation and Games ----------
const productForm20=productForm;productForm=function(step=1,editId=null){let html=productForm20(step,editId),tpl=document.createElement('template');tpl.innerHTML=html;const cat=tpl.content.querySelector('#pfCategory');if(cat&&!cat.querySelector('option[value="Games"]'))cat.insertAdjacentHTML('beforeend',`<option value="Games" ${(S.draft?.category==='Games'||product(editId)?.category==='Games')?'selected':''}>Games</option>`);const desc=tpl.content.querySelector('#pfDesc');if(desc){desc.maxLength=5000;desc.insertAdjacentHTML('afterend','<small class="char-count" data-count-for="pfDesc">'+String(desc.value.length)+'/5000</small>');desc.setAttribute('oninput',"v21InputCount('pfDesc',5000)")};const tags=tpl.content.querySelector('#tagInput');if(tags){tags.maxLength=100;tags.insertAdjacentHTML('afterend','<small class="char-count" data-count-for="tagInput">'+String(tags.value.length)+'/100 · each word max 10</small>');tags.setAttribute('oninput',"v21InputCount('tagInput',100)")};if(step===1){const grid=tpl.content.querySelector('.tag-suggest');grid?.insertAdjacentHTML('afterend',`<div class="game-tag-panel"><b>Games subcategories</b><div class="small muted">Choose PC or Mobile, then add tags such as Action, Racing, Puzzle, Sports, Arcade or Strategy.</div>${['PC','Mobile','Action','Racing','Puzzle','Sports','Arcade','Strategy'].map(t=>`<button type="button" class="btn" onclick="addDraftTag('${t}')">＋ ${t}</button>`).join('')}</div>`)}return tpl.innerHTML};
const saveStep120=saveStep1;saveStep1=function(editId){const title=(document.getElementById('pfTitle')?.value||'').trim(),tagText=(document.getElementById('tagInput')?.value||'').trim(),desc=(document.getElementById('pfDesc')?.value||'').trim();if(title.length>400)return toast('Product title maximum 400 characters');if(desc.length>5000)return toast('Description maximum 5000 characters');if(tagText.length>100)return toast('All tags together can use maximum 100 characters');const words=tagText.split(/[\s,]+/).filter(Boolean),long=words.find(x=>x.length>10);if(long)return toast('Tag word “'+long+'” is longer than 10 characters');return saveStep120(editId)};

// ---------- Separate Warning requests ----------
window.dashWarnings=function(){const s=currentSeller(),u=S.currentUser;if(!s||!u)return dashShell('warnings','<div class="dash-card"><h2>Warnings</h2><p>Seller sign-in required.</p></div>');const rows=(S.warnings||[]).filter(w=>String(w.sellerId)===String(s.id)),msgs=warningConversationFor(s),today=msgs.filter(m=>m.type!=='sent'&&todayKey(new Date(m.date).getTime())===todayKey()).length;return dashShell('warnings',`<div class="dash-card warning-support-card"><div class="section-head"><div><h2>Warning Request to Admin</h2><p>This is separate from normal Messages. Maximum 3 requests per day, including while restricted.</p></div><span class="pill">${today}/3 today</span></div><div class="warning-request-grid"><div class="field"><label>Related warning</label><select id="warnMailWarning"><option value="">Account / general warning</option>${rows.map(w=>`<option value="${esc(w.id)}">${esc(w.title||'Warning')} · ${esc(w.productTitle||w.productId||'Account')}</option>`).join('')}</select></div><div class="field"><label>Request type</label><select id="warnRequestType"><option value="SCORE_INCREASE">Increase score</option><option value="VERIFY_ME">Verify me</option><option value="RELEASE_ACCOUNT">Please release / unrestrict me</option><option value="WARNING_REVIEW">Review fixed warning</option><option value="PRODUCT_REVIEW">Review product changes</option><option value="PAYMENT_HELP">Payment help</option><option value="OTHER">Other</option></select></div></div><div class="field"><label>Subject</label><input id="warnMailSubject" maxlength="70" placeholder="Maximum 70 characters" oninput="v21InputCount('warnMailSubject',70)"><small class="char-count" data-count-for="warnMailSubject">0/70</small></div><div class="field"><label>Message</label><textarea id="warnMailBody" maxlength="2000" placeholder="Explain your request..." oninput="v21InputCount('warnMailBody',2000)"></textarea><small class="char-count" data-count-for="warnMailBody">0/2000</small></div><button class="btn primary" onclick="sendWarningMessageToAdmin()">Send warning request</button></div><div class="dash-card"><div class="section-head"><div><h2>Warnings</h2><p>Admin notices stay separate from chat.</p></div><span class="pill">${rows.length}</span></div>${rows.map(w=>`<div class="warning-card"><b>${esc(w.title||'Admin Warning')}</b><div class="small muted">${new Date(w.date).toLocaleString('en-IN')}</div>${w.productId?`<a href="#product/${encodeURIComponent(w.productId)}">Product: ${esc(w.productTitle||w.productId)}</a>`:''}<p>${esc(w.message||'')}</p></div>`).join('')||'<div class="admin-empty">No active warnings.</div>'}</div><div class="dash-card"><h2>Warning request replies</h2>${msgs.map(m=>`<div class="warning-message ${m.type==='sent'?'admin-reply':'seller-message'}"><div><b>${m.type==='sent'?'Admin':'You'}</b><span>${new Date(m.date).toLocaleString('en-IN')}</span></div><strong>${esc(m.subject||'Request')}</strong><p>${esc(m.body||'')}</p><small>${esc(m.requestType||'')}</small></div>`).join('')||'<div class="admin-empty">No warning requests yet.</div>'}</div>`)};
window.sendWarningMessageToAdmin=function(){const s=currentSeller(),u=S.currentUser;if(!s||!u)return;const store=warningMailStore(),today=store.filter(m=>String(m.sellerId)===String(s.id)&&m.type!=='sent'&&todayKey(new Date(m.date).getTime())===todayKey()).length;if(today>=3)return toast('Daily warning request limit reached: 3');const warningId=(document.getElementById('warnMailWarning')?.value||'').trim(),requestType=document.getElementById('warnRequestType')?.value||'OTHER',subject=(document.getElementById('warnMailSubject')?.value||'').trim(),body=(document.getElementById('warnMailBody')?.value||'').trim();if(!subject||!body)return toast('Subject and message are required');if(subject.length>70)return toast('Subject maximum 70 characters');if(body.length>2000)return toast('Message maximum 2000 characters');const w=warningId?(S.warnings||[]).find(x=>String(x.id)===warningId&&String(x.sellerId)===String(s.id)):null;if(warningId&&!w)return toast('Related warning not found');const m={id:uid('mail'),threadId:w?.mailThreadId||uid('thread'),type:'inbox',from:u.name||s.owner||'Seller',fromEmail:u.email||'',to:'Admin Mail Center',subject,body,date:nowISO(),read:false,starred:false,userId:u.id,sellerId:s.id,warningId:w?.id||null,productId:w?.productId||null,requestType,resolutionRequested:['WARNING_REVIEW','RELEASE_ACCOUNT'].includes(requestType)};store.unshift(m);if(w){w.mailThreadId=m.threadId;if(m.resolutionRequested){w.resolutionRequested=true;w.resolutionRequestedAt=m.date}}if(store.length>500)store.length=500;save();toast('Warning request sent');render()};

// ---------- Lightweight Admin–Seller Messages ----------
function threadForSeller(sid){v21Init();let t=S.messageThreads.find(x=>String(x.sellerId)===String(sid));if(!t){const u=S.users.find(x=>String(x.sellerId)===String(sid));t={id:uid('chat'),sellerId:sid,userId:u?.id||null,createdAt:nowISO(),updatedAt:nowISO(),archived:false,blocked:false};S.messageThreads.unshift(t)}return t}
function threadMessages(id){return S.messages.filter(x=>x.threadId===id).sort((a,b)=>new Date(a.date)-new Date(b.date))}
function dailyAllowance(sid){const cfg=S.messageSettings,base=Number(cfg.dailyLimit||50),packs=S.messagePacks.filter(x=>x.sellerId===sid&&x.day===todayKey()&&x.status==='SUCCESS').reduce((n,x)=>n+Number(x.messages||0),0),used=S.messages.filter(x=>x.sellerId===sid&&x.senderRole==='seller'&&todayKey(new Date(x.date).getTime())===todayKey()).length;return{base,packs,used,left:Math.max(0,base+packs-used)}}
function markThreadRead(t,role){threadMessages(t.id).forEach(m=>{if(m.senderRole!==role&&!m.readAt)m.readAt=nowISO()});save()}
function bubble(m,role){const mine=m.senderRole===role;return `<div class="message-bubble ${mine?'mine':''}">${esc(m.body)}<small>${new Date(m.date).toLocaleString('en-IN',{hour:'2-digit',minute:'2-digit'})} ${mine?`<span class="message-ticks ${m.readAt?'read':''}">${m.readAt?'✓✓':'✓'}</span>`:''}</small></div>`}
window.sendSellerChat=function(){const s=currentSeller(),u=S.currentUser;if(!s||!u)return;v21Init();if(S.messageSettings.enabled===false)return toast('Messages are paused by Admin');const t=threadForSeller(s.id);if(t.blocked)return toast('This chat is blocked by Admin');const body=(document.getElementById('sellerChatBody')?.value||'').trim();if(!body)return;if(body.length>2000)return toast('Message maximum 2000 characters');const q=dailyAllowance(s.id);if(!q.left)return toast('Daily limit reached. Add 20 messages for ₹10.');S.messages.push({id:uid('msg'),threadId:t.id,sellerId:s.id,userId:u.id,senderRole:'seller',body,date:nowISO(),readAt:null});t.updatedAt=nowISO();t.archived=false;save();render()};
window.sendAdminChat=function(threadId){if(!adminOnly())return;const t=S.messageThreads.find(x=>x.id===threadId),body=(document.getElementById('adminChatBody')?.value||'').trim();if(!t||!body)return;if(body.length>2000)return toast('Message maximum 2000 characters');S.messages.push({id:uid('msg'),threadId:t.id,sellerId:t.sellerId,userId:t.userId,senderRole:'admin',body,date:nowISO(),readAt:null});t.updatedAt=nowISO();t.archived=false;save();render()};

<script id="saleearn-v23-script">

<script data-saleearn-product-check="v1">
(function(){
  'use strict';
  const PC_CHECKED='adminChecked';
  const PC_VERIFIED='adminVerified';
  const pcProducts=()=>Array.isArray(S.products)?S.products:[];
  const pcChecked=p=>p?.[PC_CHECKED]===true;
  const pcVerified=p=>p?.[PC_VERIFIED]===true;
  const pcBadgeMarkup=p=>pcVerified(p)?'<span class="product-check-badge verified">✓ Verified</span>':pcChecked(p)?'<span class="product-check-badge checked">✓ Checked</span>':'';
  const pcEscId=id=>esc(encodeURIComponent(String(id||'')));

  window.adminProductCheckAction=function(id,kind){
    if(!adminOnly())return;
    const p=product(id);if(!p)return toast('Product not found');
    if(kind==='checked'){
      if(pcVerified(p))return toast('First move this product back from Verified');
      if(pcChecked(p)){
        p[PC_CHECKED]=false;
        adminAudit('Moved product back from Checked',p.id,{productId:p.id,category:p.category||null});
        save();toast('Product moved back from Checked');
      }else{
        p[PC_CHECKED]=true;
        adminAudit('Checked product',p.id,{productId:p.id,category:p.category||null});
        save();toast('Product added to Checked');
      }
    }else if(kind==='verified'){
      if(pcVerified(p)){
        p[PC_VERIFIED]=false;
        p[PC_CHECKED]=true;
        adminAudit('Moved product back from Verified',p.id,{productId:p.id,category:p.category||null});
        save();toast('Product moved back to Checked');
      }else{
        p[PC_CHECKED]=true;
        p[PC_VERIFIED]=true;
        adminAudit('Verified product',p.id,{productId:p.id,category:p.category||null});
        save();toast('Product added to Verified');
      }
    }
    render();
  };

  function pcCategoryOptions(selected){
    const cats=[...new Set(pcProducts().map(p=>String(p.category||'Other').trim()||'Other'))].sort((a,b)=>a.localeCompare(b));
    return '<option value="ALL">All categories</option>'+cats.map(c=>`<option value="${esc(c)}" ${selected===c?'selected':''}>${esc(c)}</option>`).join('');
  }
  function pcProductCard(p){
    const checked=pcChecked(p),verified=pcVerified(p),sellerData=seller(p.sellerId);
    const checkedLabel=verified?'Checked':checked?'Back Checked':'Check';
    const verifyLabel=verified?'Back Verified':'Verify';
    return `<article class="pc-product"><div class="pc-product-image">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.title||'Product')}">`:'🧩'}</div><div class="pc-product-main"><h3 title="${esc(p.title||'Untitled product')}">${esc(p.title||'Untitled product')}</h3><div class="pc-meta">Category: <b>${esc(p.category||'Other')}</b><br>Seller: @${esc(p.sellerId||'-')} · ${esc(sellerData.name||'Seller')}<br>Price: ${money(p.price||0)} · Sales: ${productSales(p.id)}</div><div class="pc-badges">${pcBadgeMarkup(p)}</div><div class="pc-actions"><button class="btn" onclick="adminNav('product/${pcEscId(p.id)}')">Open Product</button><button class="btn ${checked&&!verified?'primary':''}" ${verified?'disabled':''} onclick="adminProductCheckAction('${pcEscId(p.id)}','checked')">${checkedLabel}</button><button class="btn ${verified?'primary':''}" onclick="adminProductCheckAction('${pcEscId(p.id)}','verified')">${verifyLabel}</button></div></div></article>`;
  }
  function pcCounts(){const all=pcProducts();return {total:all.length,checked:all.filter(pcChecked).length,verified:all.filter(pcVerified).length};}
  function pcSidebar(){
    let side=adminSidebar('product-check');
    const link='<button class="admin-link active" onclick="adminNav(\'product-check\')"><span>✓</span><span class="label">Product Check</span></button>';
    const marker='<div class="admin-nav-title">System</div>';
    if(!side.includes('Product Check'))side=side.replace(marker,link+marker);
    return side;
  }
  function pcPage(){
    if(!adminOnly())return `${header()}<main class="page"></main>`;
    const counts=pcCounts();
    const tab=window.pcTab||'total',cat=window.pcCategory||'ALL',q=String(window.pcQuery||'').trim().toLowerCase();
    let rows=pcProducts();
    if(tab==='checked')rows=rows.filter(pcChecked);
    if(tab==='verified')rows=rows.filter(pcVerified);
    if(cat!=='ALL')rows=rows.filter(p=>String(p.category||'Other')===cat);
    if(q)rows=rows.filter(p=>`${p.title||''} ${p.id||''} ${p.sellerId||''} ${p.category||''}`.toLowerCase().includes(q));
    const tabs=[['total','Total',counts.total],['checked','Checked',counts.checked],['verified','Verified',counts.verified]];
    const content=`<div class="admin-card"><div class="section-head"><div><h2>Product Check</h2><div class="sub">Review every product and mark it Checked or Verified. Verified products are also Checked.</div></div><span class="admin-pill success">${counts.total} Products</span></div><div class="pc-tabs">${tabs.map(([id,label,count])=>`<button class="pc-tab ${tab===id?'active':''}" onclick="window.pcTab='${id}';render()">${label}<span>${count}</span></button>`).join('')}</div><div class="pc-toolbar"><input class="input admin-search" value="${esc(window.pcQuery||'')}" placeholder="Search product, seller or ID" oninput="pcFilterList(this)"><select class="input" onchange="window.pcCategory=this.value;render()">${pcCategoryOptions(cat)}</select></div><div class="pc-grid">${rows.map(pcProductCard).join('')||'<div class="pc-empty">No products found in this view.</div>'}</div></div>`;
    return `<div class="admin-shell">${pcSidebar()}<section class="admin-main">${adminTop('Product Check')}<div class="admin-content">${content}</div></section></div>`;
  }

  function pcDetailWithControls(id){
    const p=product(id),html=adminProductDetail(id);
    if(!p)return html;
    const checked=pcChecked(p),verified=pcVerified(p);
    const controls=`<div class="admin-card" style="margin-bottom:18px"><div class="section-head"><div><h2>Product Review</h2><div class="sub">Admin review status is shown on the marketplace product card.</div></div><div>${pcBadgeMarkup(p)||'<span class="admin-pill warn">Not checked</span>'}</div></div><div class="admin-actions"><button class="btn ${checked&&!verified?'primary':''}" ${verified?'disabled':''} onclick="adminProductCheckAction('${pcEscId(p.id)}','checked')">${verified?'✓ Checked':checked?'Back Checked':'Mark Checked'}</button><button class="btn ${verified?'primary':''}" onclick="adminProductCheckAction('${pcEscId(p.id)}','verified')">${verified?'Back Verified':'Mark Verified'}</button><button class="btn" onclick="adminNav('product-check')">Back to Product Check</button></div></div>`;
    return html.replace('<div class="admin-content">',`<div class="admin-content">${controls}`);
  }

  const pcOriginalProductCard=productCard;
  productCard=function(p){
    let html=pcOriginalProductCard(p);
    const badge=pcBadgeMarkup(p);if(!badge)return html;
    const tpl=document.createElement('template');tpl.innerHTML=html;
    const tagWrap=tpl.content.querySelector('.body > div');
    if(tagWrap)tagWrap.insertAdjacentHTML('beforeend',badge);
    return tpl.innerHTML;
  };

  const pcOriginalRender=window.render;
  window.render=function(){
    const r=route();
    if(r==='admin/product-check'){
      document.getElementById('app').innerHTML=pcPage();
      applyPlatformConfig();
      if(typeof bindAdminScroll==='function')bindAdminScroll();
      return;
    }
    if(r.startsWith('admin/product/')){
      const id=decodeURIComponent(r.split('/')[2]||'');
      document.getElementById('app').innerHTML=pcDetailWithControls(id);
      applyPlatformConfig();
      if(typeof bindAdminScroll==='function')bindAdminScroll();
      return;
    }
    pcOriginalRender();
  };

  // Re-render the current route once so marketplace badges appear immediately.
  setTimeout(()=>window.render(),0);
})();
</script>

<script data-saleearn-admin-seller-preview="v1">
(function(){
  'use strict';
  const originalDashShell=typeof dashShell==='function'?dashShell:null;

  window.adminOpenSellerDashboard=function(sid){

  window.adminExitSellerDashboard=function(){

<script data-saleearn-admin-sales-products="v1">
(function(){
  'use strict';
  const originalAdminSales=adminSales;
  function moneyForOrder(o){return Number(o?.amount||0)}
  function netForOrder(o){return o?.netSellerAmount!=null?Number(o.netSellerAmount):moneyForOrder(o)*(1-Number(o?.platformFeeRate??.20))}
  function sellerProducts(sid,orders){
    const grouped={};
    orders.filter(o=>String(o.sellerId||'')===String(sid)).forEach(o=>{
      const pid=String(o.productId||'deleted');
      if(!grouped[pid])grouped[pid]={orders:0,gross:0,net:0};
      grouped[pid].orders++;
      grouped[pid].gross+=moneyForOrder(o);
      grouped[pid].net+=netForOrder(o);
    });
    return Object.entries(grouped).map(([pid,v])=>({pid,...v,product:product(pid)})).sort((a,b)=>b.gross-a.gross);
  }
  function salesProductCard(x){
    const p=x.product,title=p?.title||'Deleted product', image=p?.image;
    return `<div class="sales-product-row"><div class="sales-product-thumb">${image?`<img src="${esc(image)}" alt="${esc(title)}">`:'🧩'}</div><div class="sales-product-info"><h4 title="${esc(title)}">${esc(title)}</h4><div class="small muted">${p?`${esc(p.category||'Product')} · ${esc(p.id)}`:'Product no longer live'}</div><div class="sales-product-money"><span>Orders <b>${x.orders}</b></span><span>Gross <b>${money(x.gross)}</b></span><span>Net <b>${money(x.net)}</b></span></div>${p?`<button class="btn sales-product-open" onclick="adminNav('product/${esc(encodeURIComponent(p.id))}')">Open Product</button>`:''}</div></div>`;
  }
  adminSales=function(){
    const st=adminStats(),orders=st.orders,today=new Date().toDateString();
    const todayOrders=orders.filter(x=>new Date(x.date).toDateString()===today);
    const bySeller={};
    orders.forEach(o=>{const sid=String(o.sellerId||'unknown');if(!bySeller[sid])bySeller[sid]={orders:0,gross:0,net:0};bySeller[sid].orders++;bySeller[sid].gross+=moneyForOrder(o);bySeller[sid].net+=netForOrder(o)});
    const sellerCards=Object.entries(bySeller).sort((a,b)=>b[1].gross-a[1].gross).map(([sid,v])=>{
      const ss=seller(sid),items=sellerProducts(sid,orders);
      return `<section class="sales-seller-card"><div class="sales-seller-head"><div class="sales-seller-name"><h3>@${esc(sid)}</h3><div class="small muted">${esc(ss?.name||'Seller store')}</div><div class="small muted">Owner: ${esc(ss?.owner||'-')}</div></div><div class="sales-seller-stats"><div class="sales-seller-stat"><small>Orders</small><b>${v.orders}</b></div><div class="sales-seller-stat"><small>Gross sales</small><b>${money(v.gross)}</b></div><div class="sales-seller-stat"><small>Net earnings</small><b>${money(v.net)}</b></div><button class="btn" onclick="adminNav('seller/${esc(encodeURIComponent(sid))}')">Seller Details</button></div></div><div class="sales-products-title">Products sold (${items.length})</div><div class="sales-products">${items.map(salesProductCard).join('')||'<div class="sales-empty">No product records found.</div>'}</div></section>`;
    }).join('');
    return adminLayout('sales','Sales & Earnings',`<div class="admin-kpis"><div class="admin-kpi"><span>Total Sales</span><b>${money(st.sales)}</b></div><div class="admin-kpi"><span>Net Seller Earnings</span><b>${money(st.earnings)}</b></div><div class="admin-kpi"><span>Today's Sales</span><b>${money(todayOrders.reduce((a,x)=>a+moneyForOrder(x),0))}</b></div><div class="admin-kpi"><span>Today's Orders</span><b>${todayOrders.length}</b></div></div><div class="admin-card"><div class="section-head"><div><h2>Seller-wise Sales</h2><div class="sub">Every sold product is shown as a separate card with image, title, orders and earnings.</div></div><span class="admin-pill success">${Object.keys(bySeller).length} Sellers</span></div><div class="sales-seller-grid">${sellerCards||'<div class="sales-empty">No successful sales.</div>'}</div></div>`);
  };
  setTimeout(()=>{if(route()==='admin/sales')render()},0);
})();
</script>

<script data-saleearn-admin-profile-search="v1">
(function(){
  'use strict';

  function inputValue(id){return String(document.getElementById(id)?.value||'').trim()}
  function profileLinkRows(t){
    const rows=Array.isArray(t?.links)&&t.links.length?t.links:[{title:'',url:''}];
    return rows.map(x=>`<div class="se-admin-profile-link" data-se-admin-link><div class="field"><label>Link title</label><input class="seAdminLinkTitle" maxlength="100" value="${esc(x.title||'')}" placeholder="Telegram, Portfolio..."></div><div class="field"><label>Link URL</label><input class="seAdminLinkUrl" maxlength="400" value="${esc(x.url||'')}" placeholder="https://..."></div><button type="button" class="btn danger" onclick="this.closest('[data-se-admin-link]').remove()">Remove</button></div>`).join('')
  }
  window.addAdminProfileLink=function(){
    const box=document.getElementById('seAdminProfileLinks');
    if(!box)return;
    if(box.children.length>=12)return toast('Maximum 12 links');
    box.insertAdjacentHTML('beforeend',profileLinkRows({links:[{title:'',url:''}]}));
  };

  function rewriteReferences(oldUser,newUser,oldSeller,newSeller){
    const userKeys=['id','userId','customerId','buyerId','ownerId','memberId'];
    const sellerKeys=['sellerId','storeId'];
    const rewrite=row=>{
      if(!row||typeof row!=='object')return;
      userKeys.forEach(k=>{if(k!=='id'&&row[k]===oldUser)row[k]=newUser});
      sellerKeys.forEach(k=>{if(row[k]===oldSeller)row[k]=newSeller});
      if(row.createdBy===oldUser)row.createdBy=newUser;
      if(row.updatedBy===oldUser)row.updatedBy=newUser;
    };
    ['users','products','orders','payouts','ads','referrals','warnings','devices','disputes','refunds','couponRedemptions','downloadEvents','gatewayPayments','messages','messageThreads','serviceRefunds','sellerFinanceLedger','securityEvents','notifications'].forEach(k=>Array.isArray(S[k])&&S[k].forEach(rewrite));
    if(S.currentUser?.id===oldUser)S.currentUser.id=newUser;
  }

  window.adminSaveUserProfile=function(oldUserId){
    if(!adminOnly())return;
    const u=(S.users||[]).find(x=>String(x.id)===String(oldUserId));
    if(!u)return toast('User not found');
    const oldUid=String(u.id),oldSid=String(u.sellerId||'');
    const newUid=inputValue('seAdminUserId')||oldUid;
    const newSid=inputValue('seAdminSellerId')||oldSid;
    const reserved=['ADMIN','SALEEARN','SUPPORT','ROOT','SYSTEM'];
    if(!newUid||reserved.includes(newUid.toUpperCase()))return toast('This User ID is reserved');
    if((S.users||[]).some(x=>x!==u&&String(x.id).toLowerCase()===newUid.toLowerCase()))return toast('User ID already exists');
    if(oldSid){
      if(!newSid||reserved.includes(newSid.toUpperCase()))return toast('This Seller ID is reserved');
      if(newSid!==oldSid&&S.sellers?.[newSid])return toast('Seller ID already exists');
    }
    const newName=inputValue('seAdminUserName')||u.name||newUid;
    const newEmail=inputValue('seAdminEmail');
    const newUserAbout=inputValue('seAdminUserAbout').slice(0,5000);
    const ss=oldSid?S.sellers?.[oldSid]:null;
    const newStoreName=inputValue('seAdminStoreName')||ss?.name||'Seller Store';
    const newOwner=inputValue('seAdminStoreOwner')||newName;
    const newStoreBio=inputValue('seAdminStoreBio').slice(0,5000);
    const newSupport=inputValue('seAdminSupport').slice(0,300);
    const newAbout=inputValue('seAdminAbout').slice(0,5000);
    const newPolicies=inputValue('seAdminPolicies').slice(0,5000);
    const newVideo=safeHttpUrl(inputValue('seAdminVideo'));
    const newInstagram=safeHttpUrl(inputValue('seAdminInstagram'));
    const newYoutube=safeHttpUrl(inputValue('seAdminYoutube'));
    const newWebsite=safeHttpUrl(inputValue('seAdminWebsite'));
    const links=[...document.querySelectorAll('[data-se-admin-link]')].map(row=>({title:String(row.querySelector('.seAdminLinkTitle')?.value||'').trim().slice(0,100),url:safeHttpUrl(String(row.querySelector('.seAdminLinkUrl')?.value||'').trim())})).filter(x=>x.title&&x.url).slice(0,12);

    if(oldUid!==newUid||oldSid!==newSid)rewriteReferences(oldUid,newUid,oldSid,newSid||oldSid);
    u.id=newUid;u.userId=newUid;u.name=newName;u.email=newEmail;u.bio=newUserAbout;u.about=newUserAbout;
    if(oldSid&&ss){
      if(oldSid!==newSid){delete S.sellers[oldSid];ss.id=newSid;S.sellers[newSid]=ss;}
      ss.name=newStoreName;ss.owner=newOwner;ss.bio=newStoreBio;ss.support=newSupport;
      S.storeThemes=S.storeThemes||{};
      const oldTheme=S.storeThemes[oldSid]||{};
      if(oldSid!==newSid)delete S.storeThemes[oldSid];
      S.storeThemes[newSid]={...oldTheme,about:newAbout,policies:newPolicies,video:newVideo,instagram:newInstagram,youtube:newYoutube,website:newWebsite,links};
      if(S.badgeLedgers?.[oldSid]&&oldSid!==newSid){S.badgeLedgers[newSid]=S.badgeLedgers[oldSid];delete S.badgeLedgers[oldSid]}
    }
    adminAudit('Updated user and seller profile',newUid,{oldUserId:oldUid,newUserId:newUid,oldSellerId:oldSid||null,newSellerId:newSid||null});
    save();toast('User and seller profile updated');
    adminNav('user/'+encodeURIComponent(newUid));
  };

  function adminProfileEditor(u,ss){
    const t=ss?storeTheme(ss.id):{};
    return `<div class="admin-card se-admin-profile-editor"><div class="section-head"><div><h2>Edit User & Seller Profile</h2><div class="sub">Admin can update the account identity, seller store About section and all public links.</div></div><span class="admin-pill warn">Admin control</span></div><div class="se-admin-profile-note">Changing User ID or Seller ID updates the connected products, orders, payouts and seller records automatically. Use full URLs beginning with http:// or https://.</div><div class="se-admin-profile-grid"><div class="field"><label>User name</label><input id="seAdminUserName" maxlength="120" value="${esc(u.name||'')}" placeholder="User name"></div><div class="field"><label>User ID</label><input id="seAdminUserId" maxlength="80" value="${esc(u.id||'')}" placeholder="User ID"></div><div class="field"><label>Email</label><input id="seAdminEmail" type="email" maxlength="180" value="${esc(u.email||'')}" placeholder="email@example.com"></div><div class="field"><label>User About</label><input id="seAdminUserAbout" maxlength="5000" value="${esc(u.bio||u.about||'')}" placeholder="Short user about"></div>${ss?`<div class="field"><label>Seller ID</label><input id="seAdminSellerId" maxlength="100" value="${esc(ss.id||'')}" placeholder="Seller ID"></div><div class="field"><label>Store name</label><input id="seAdminStoreName" maxlength="160" value="${esc(ss.name||'')}" placeholder="Store name"></div><div class="field"><label>Store owner</label><input id="seAdminStoreOwner" maxlength="160" value="${esc(ss.owner||u.name||'')}" placeholder="Owner name"></div><div class="field"><label>Support contact</label><input id="seAdminSupport" maxlength="300" value="${esc(ss.support||'')}" placeholder="Email, Telegram or support detail"></div><div class="field se-admin-profile-wide"><label>Store bio</label><textarea id="seAdminStoreBio" maxlength="5000" placeholder="Store description">${esc(ss.bio||'')}</textarea></div><div class="field se-admin-profile-wide"><label>Public About section</label><textarea id="seAdminAbout" maxlength="5000" placeholder="What should visitors know about this seller?">${esc(t.about||'')}</textarea></div><div class="field se-admin-profile-wide"><label>Store policies</label><textarea id="seAdminPolicies" maxlength="5000" placeholder="Refund, usage or delivery policies">${esc(t.policies||'')}</textarea></div><div class="field"><label>Introduction video URL</label><input id="seAdminVideo" maxlength="400" value="${esc(t.video||'')}" placeholder="https://youtube.com/watch?v=..."></div><div class="field"><label>Website URL</label><input id="seAdminWebsite" maxlength="400" value="${esc(t.website||'')}" placeholder="https://..."></div><div class="field"><label>Instagram URL</label><input id="seAdminInstagram" maxlength="400" value="${esc(t.instagram||'')}" placeholder="https://instagram.com/..."></div><div class="field"><label>YouTube URL</label><input id="seAdminYoutube" maxlength="400" value="${esc(t.youtube||'')}" placeholder="https://youtube.com/..."></div><div class="field se-admin-profile-wide"><label>Public About links</label><div id="seAdminProfileLinks" class="se-admin-profile-links">${profileLinkRows(t)}</div><button type="button" class="btn" style="margin-top:9px" onclick="addAdminProfileLink()">＋ Add link</button></div>`:'<div class="field se-admin-profile-wide"><div class="admin-empty">This account has no seller store yet.</div></div>'}</div><div class="se-admin-profile-actions"><span class="small muted">Changes are saved through the existing state sync.</span><button class="btn primary" onclick="adminSaveUserProfile('${esc(u.id)}')">Save User & Seller Profile</button></div></div>`;
  }

  const originalAdminUserDetail=adminUserDetail;
  adminUserDetail=function(id){
    const u=(S.users||[]).find(x=>String(x.id)===String(id));
    const html=originalAdminUserDetail(id);
    if(!u)return html;
    const ss=u.sellerId?seller(u.sellerId):null;
    const tpl=document.createElement('template');tpl.innerHTML=html;
    tpl.content.querySelector('.admin-content')?.insertAdjacentHTML('afterbegin',adminProfileEditor(u,ss));
    return tpl.innerHTML;
  };

  window.pcFilterList=function(input){
    window.pcQuery=input.value||'';
    const q=window.pcQuery.trim().toLowerCase();
    document.querySelectorAll('.pc-grid .pc-product').forEach(card=>{
      const text=String(card.textContent||'').toLowerCase();
      card.hidden=!!q&&!text.includes(q);
    });
  };
  window.orderLiveSearch=function(input){
    window.orderSearch=input.value||'';
    const q=window.orderSearch.trim().toLowerCase();
    document.querySelectorAll('.dash-table tbody tr').forEach(row=>{
      row.hidden=!!q&&!String(row.textContent||'').toLowerCase().includes(q);
    });
  };
})();
</script>
